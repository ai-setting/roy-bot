# Greeting Workflow Example
# 
# 这是一个简单的问候 Workflow：
# 1. 只有一个 agentNode
# 2. Agent 调用 askUser 询问用户名字
# 3. 触发中断
# 4. 用户回复后打招呼然后结束

name: greeting-workflow
version: "1.0.0"
description: "一个简单的问候 Workflow，先询问用户名字，然后打招呼"

# Workflow 配置
config: {}
# 默认即为同步等待完成模式。ask_user 触发暂停属于正常状态，CLI 会
# 渲染 pause + query，用户可通过 `workflow resume` / workflow_run
# 的 `session` 字段继续。
# Task #2086: 移除 `sync: false` 字段（fire-and-forget 模式已废弃）

# 入口节点
entry: greeting-agent

# 节点定义
nodes:
  - id: greeting-agent
    type: agent
    description: "问候 Agent"
    config:
      agent_type: general
      # Agent 会自动调用 ask_user 工具询问用户名字
      prompt: |
        你是一个友好的问候助手。
        
        请使用 ask_user 工具询问用户的名字。
        
        重要：
        1. 必须使用 ask_user 工具来询问
        2. 如果用户已经回答了问题（你会在消息历史中看到用户回复），直接用回复中的名字打招呼，不要再次询问
        3. 打招呼格式：你好，{名字}！很高兴认识你！
    # 无需依赖其他节点
    depends_on: []
