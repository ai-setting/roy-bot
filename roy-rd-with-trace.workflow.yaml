name: roy-rd-with-trace
version: "1.5.0"
description: >
  R&D 研发工作流的 trace-first 变体 — 在 roy-rd-pipeline 的 9 节点骨架上，把"可调试性 / 可观测性"作为一等公民，贯穿 plan → implement → e2e → verify 四个阶段。

  与 roy-rd-pipeline 的核心差异化点（trace 闭环）：

    1. plan 阶段输出 expected_traces：识别核心代码/核心流程，规划预期 span_name、record 策略、关键出入参字段路径（颗粒度：字段形状，不锁死具体值）。
    2. tdd-implement 阶段落地 @TracedAs：import 自 packages/core/src/env/log-trace/decorator.ts 的 TracedAs 注解；统一使用 @TracedAs，禁止 @Traced / @TracedLightweight；span_name 必须与 expected_traces 完全一致。
    3. cli-e2e-test 阶段自动对照：用 `roy-bot debug trace <traceId>` / `roy-bot debug span <spanId>` 解析 spans.db（~/.config/roy-bot/spans.db），逐 expected_trace 做 4 步中粒度检查（span 存在性、name 精确一致、record_params=true 时的 key_params 字段形状、record_result=true 时的 key_result_fields 字段形状）。任意 expected_trace 失败 → trace_check_status=FAIL → cli_e2e_status=FAIL → 触发回环到 tdd-implement 重做。
    4. final-verify 阶段轻量复验：再抽查 1-2 个 expected_traces 是否仍能在 spans.db 中查到（防止 e2e → merge 之间 trace 被破坏），checklist.trace_re_verified 必须为 true。

  与 roy-rd-pipeline 共用：9 节点顺序、init-task / setup-worktree / code-review / merge-to-main / summary-report 五个节点完全复用；合并主分支铁律、auto_merge 决策树、worktree 保留等约束原样保留。

  包含 9 个独立节点（串行执行，保证每阶段产物被下阶段读取）。

  阶段 5"修复问题"是阶段 4 的失败回环（loop back），不是独立节点。
    Phase 1  init-task         — 任务管理（task_search 找相似 + task_create + task_update active）
    Phase 2.5 capture-baseline — v1.5.0 新增 — 集中捕获 pre-modification baseline（4 stage × N categories）
    Phase 2  setup-worktree    — Worktree 隔离（git worktree add，幂等检查避免重复创建）
    Phase 3  plan              — 设计与计划（brainstorming + writing-plans skills，输出 plan_doc + **expected_traces**）
    Phase 4  tdd-implement     — TDD 严格循环 + **@TracedAs 落地**（输出 implemented_traces）
    Phase 5  code-review       — Code Review（requesting-code-review skill，输出 BLOCKING/IMPORTANT/MINOR/NIT 分级；含 bun test 4 并发加速提示）
    Phase 6  cli-e2e-test      — 命令行级 E2E + **Trace 对照**（输出 trace_check_status + trace_check_failures）
    Phase 7  final-verify      — 最终验证 + **trace_re_verified**（verification-before-completion skill，9 项 checklist；含 bun test 4 并发加速提示）
    Phase 8  merge-to-main     — 可选合并（agent: roy 调 bash 执行 git merge；auto_merge 必须显式 "true" 才执行；冲突自动 rebase；merge 后跑 build/test 验证 main 未被破坏；提交 JSON 输出 merge_status）
    Phase 9  summary-report    — 总结报告（写入 reports/<task_id>-rd-summary.md + task_complete）

  ⚠️ 合并主分支铁律：
    - merge-to-main 节点的 `auto_merge` 参数必须显式为 "true" 才执行 merge
    - 默认 "false"，节点会跳过 merge 并输出 MERGE_SKIPPED
    - 即使 auto_merge=true，merge 前必须用 git merge-tree 预检冲突，冲突时自动 rebase 解决
    - merge 后必须跑 build/test 验证 main 仍健康，否则回滚
    - worktree 保留（不清理），等用户最终验收

  与现有 workflow 的区别：
    - feature-development: 缺 plan 节点、缺 code-review、merge-and-cleanup 不预检冲突
    - feature-implementation / bug-investigation: 4 节点 PLAN/EXECUTE/VERIFY 模型，缺 worktree 隔离、CLI 级 e2e、可控 merge
    - strict-task-agent-v522: 通用 PLAN/EXECUTE/VERIFY + resume gate，不是 R&D 专用模板

  使用场景：所有 R&D 任务（feature / bug fix / refactor）均推荐使用此 workflow。

  变更日志：
    - v1.1.0: 移除 8 处 "CRITICAL — 必须调用 workflow_submit_output" 工具调用提醒，让 agentNode 依赖 output.mode=json 自动提取；tdd-implement Step 4.0.4 拆分为 4 个子场景（4.0.4.a self-loop / 4.0.4.b code-review / 4.0.4.c cli-e2e-test / 4.0.4.d final-verify），每个子场景含自约束（防 10 次空转）。
    - v1.2.0: 新增 inputs.task_e2e_commands（任务相关真实 CLI E2E 命令清单）；plan 节点新增 task_e2e_commands 姊妹字段（与 expected_traces 并列）；cli-e2e-test 新增 Step 6.1.6（任务相关 CLI E2E + log/debug_trace/debug_span/combined 四种验证）+ Step 6.1.7（五阶段总判定），新增 schema 字段 task_e2e_status / task_e2e_commands_executed / task_e2e_discovered_count；final-verify checklist 9 → 10 项（新增 task-specific-e2e-passes 独立复跑）；cli-e2e-test + final-verify prompt 加 "Bun 跑 CLI 铁律" 段（防 __require 报错）。
    - v1.3.0: 新增 Step 6.0.5 依赖前置检查（在 build/test 之前对任务涉及的 workflow YAML 跑静态依赖一致性检查，4 类 FAIL 信号：depends_on 节点缺失 / edges 节点缺失 / edges 与 depends_on 方向不一致 / entry 节点缺失；任一 FAIL → cli_e2e_status = "FAIL"，fail-fast）；用 `prescanWorkflowFile` from `packages/core/src/env/workflow/utils/dependency-prescan.ts`。Task #2241（re-verify Task #2240）。
    - v1.4.0: 吸收 tongagent-rd-pipeline v1.1 baseline regression testing protocol。5 category（test/lint/typecheck/build/cli-smoke）；immutable baseline（一次性写入，多次复用，禁覆盖）；稳定 ID = `<category>:<file>:<symbol>:<line|errorCode>`，sorted+unique。新增 inputs.baseline_regression_enabled（默认 "true"，向后兼容）、inputs.lint_command、inputs.typecheck_command。tdd-implement / code-review / cli-e2e-test / final-verify 各加专属 baseline capture 步骤（Step 4.3.5 / 5.2.5 / 6.1.b1/t1/c1/m1 / 7.3.6）。**绝对零失败不是 PASS 条件**；pre-existing failures 不阻断；只看 baseline 外新增稳定 ID。fail-closed 规则：baseline 缺失/损坏/invocation_hash 不一致/命令集合漂移/capture 非零但 failures 为空/跨 worktree 切换/timeout 均 FAIL。Task #2302。
    - v1.5.0: 新增 capture-baseline 节点（位置：setup-worktree → plan 之间），集中捕获 4 份 immutable baseline（按 stage 分类：tdd / review / e2e / verify），写入中央 manifest `/tmp/$TASK_ID-central-baseline.json`。下游 4 节点（tdd-implement / code-review / cli-e2e-test / final-verify）改为读中央 manifest + 仅 capture modified（不再各自 capture baseline）。**重要**：保持 invocation_hash 兼容性 — 每份 baseline 用对应 stage 的 categories，保证下游 modified.invocation_hash == baseline.invocation_hash（避免 verify 脚本 command_set_drift 失败）。向后兼容：baseline_regression_enabled=false 仍可工作（capture-baseline 写空 manifest）。不修改 capture_roy_rd_baseline.py / verify_roy_rd_baseline.py 脚本本身。scripts/capture_roy_rd_baseline.py + scripts/verify_roy_rd_baseline.py 路径约定不变。Task #2369。
config:
  parallel_limit: 1
  timeout: 1800000
  maxIterations: 10
  loopEnabled: true
nodes:
  - id: init-task
    type: agent
    name: "Phase 1: 任务管理 (task_search → task_create → task_update active)"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
          description: 任务管理结果 — task_id 给后续节点使用
          properties:
            task_id:
              type: integer
            task_type:
              type: string
            branch:
              type: string
            worktree_path:
              type: string
            similar_tasks_referenced:
              type: array
              items:
                type: integer
          required:
            - task_id
            - task_type
            - branch
            - worktree_path
      prompt: >
        ## Phase 1: 任务管理


        任务类型: {{input.task_type}}

        任务标题: {{input.task_title}}

        任务描述: {{input.task_description}}


        ### Step 1.1: 搜索相似任务（强建议）

        - 调用 task_search(keywords=["{{input.task_type}}",
        "{{input.branch_name}}"], limit=5) 找相似历史任务

        - 如果找到（如 #1770 plugin emit notification / #1993 install package-json /
        #1975 ask-user-timeout），
          在 task description 里追加引用 "参考任务: #XXX, #YYY"，供后续节点阅读
        - 推荐相似任务模式（来自上一周 R&D 实践）：
            - Feature: 多子任务（T-A 到 T-H），TDD + 集成测试 + build
            - Bug fix: 根因调查 → RED 失败测试 → GREEN 最小修复 → CLI 实际复现 → build
            - Refactor: 移除旧机制 + 重写 + typecheck + build 验证

        ### Step 1.2: 创建任务

        - 调用 task_create(
            title="{{input.task_title}}",
            description="{{input.task_description}}",
            type="normal",
            priority="{{input.task_priority}}",
            tags=["{{input.task_type}}", "rd-pipeline", "{{input.branch_name}}"{{#if input.task_tags}}, {{input.task_tags}}{{/if}}]
          )
        - task_update(status="active", progress=5)

        - task_operation_create(action_type="create", action_title="Task created
        via roy-rd-pipeline v1.2")


        ### Step 1.3: 写入 context（关键，给后续节点用）

        - 调用 task_update(
            task_id=<返回的 task_id>,
            context='{"worktree_path": "{{input.project_path}}/.worktrees/{{input.branch_name}}",
                      "branch": "{{input.task_type}}/{{input.branch_name}}",
                      "task_type": "{{input.task_type}}",
                      "base_branch": "{{input.base_branch}}",
                      "pipeline_version": "1.0"}'
          )

        ### Step 1.4: 输出

        输出以下 JSON（系统会自动提取）：

        ```json

        {
          "task_id": <number>,
          "task_type": "{{input.task_type}}",
          "branch": "{{input.task_type}}/{{input.branch_name}}",
          "worktree_path": "{{input.project_path}}/.worktrees/{{input.branch_name}}",
          "similar_tasks_referenced": [<task_ids>]
        }

        ```

        - `task_id` 是后续所有节点读取任务状态的核心 ID
        - **不要**用普通文本输出
    depends_on: []
  - id: setup-worktree
    type: tool
    name: "Phase 2: Worktree 隔离 (git worktree add，幂等检查)"
    config:
      tool: bash
      command: >
        set -eu

        cd {{input.project_path}}


        BRANCH="{{input.task_type}}/{{input.branch_name}}"

        WORKTREE_PATH=".worktrees/{{input.branch_name}}"


        # 幂等检查：worktree 已存在则跳过

        if git worktree list | grep -q "$WORKTREE_PATH"; then
          echo "WORKTREE_EXISTS: $WORKTREE_PATH"
          echo "BRANCH: $BRANCH"
          exit 0
        fi


        # 验证 base_branch 存在

        if ! git rev-parse --verify "{{input.base_branch}}" >/dev/null 2>&1;
        then
          echo "ERROR: base_branch '{{input.base_branch}}' not found"
          exit 1
        fi


        # 验证 branch 不与现有分支冲突

        if git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then
          echo "ERROR: branch '$BRANCH' already exists; pick a different branch_name"
          exit 2
        fi


        git worktree add "$WORKTREE_PATH" -b "$BRANCH" "{{input.base_branch}}"

        echo "WORKTREE_CREATED: $WORKTREE_PATH"

        echo "BRANCH: $BRANCH"

        echo "BASE: {{input.base_branch}}"
    depends_on:
      - init-task
  - id: capture-baseline
    type: tool
    name: "Phase 2.5: Capture pre-modification baseline (centralized, v1.5.0 新增)"
    config:
      tool: bash
      command: |
        set -eu
        cd {{input.project_path}}/.worktrees/{{input.branch_name}}

        TASK_ID="{{nodes.init-task.task_id}}"

        if [ -z "$TASK_ID" ]; then
          echo "ERROR: TASK_ID is required (from init-task node)"
          exit 1
        fi

        # baseline_regression_enabled check (向后兼容)
        if [ "{{input.baseline_regression_enabled}}" != "true" ]; then
          echo "BASELINE_DISABLED"
          mkdir -p "/tmp"
          cat > "/tmp/$TASK_ID-central-baseline.json" <<EOF
        {"task_id": $TASK_ID, "baseline_status": "DISABLED", "captured_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)", "worktree_path": "$(pwd)", "baseline_files": {}}
        EOF
          exit 0
        fi

        # 关键设计：每个下游节点 (tdd/review/e2e/verify) 都需要 invocation_hash 兼容的 baseline
        # 因此 capture-baseline 节点按 stage 分类捕获 4 个 baseline 文件
        # 每个 baseline 文件用对应 stage 的 categories，保证下游节点 modified.invocation_hash == baseline.invocation_hash
        declare -A BASELINE_FILES
        for stage in tdd review e2e verify; do
          case "$stage" in
            tdd)    categories="test,lint,typecheck";;
            review) categories="test,lint,typecheck";;
            e2e)    categories="build,test,cli-smoke";;
            verify) categories="test,lint,typecheck,build,cli-smoke";;
          esac

          baseline_out="/tmp/$TASK_ID-baseline-$stage.json"
          python3 scripts/capture_roy_rd_baseline.py \
            --stage "$stage" \
            --category "$categories" \
            --task-id "$TASK_ID" \
            --out "$baseline_out"

          BASELINE_FILES[$stage]="$baseline_out"
        done

        # Write central manifest
        mkdir -p "/tmp"
        cat > "/tmp/$TASK_ID-central-baseline.json" <<EOF
        {
          "task_id": $TASK_ID,
          "baseline_status": "SUCCESS",
          "captured_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "worktree_path": "$(pwd)",
          "baseline_files": {
            "tdd": "${BASELINE_FILES[tdd]}",
            "review": "${BASELINE_FILES[review]}",
            "e2e": "${BASELINE_FILES[e2e]}",
            "verify": "${BASELINE_FILES[verify]}"
          }
        }
        EOF

        echo "BASELINE_CAPTURED: $(ls -la /tmp/$TASK_ID-baseline-*.json 2>/dev/null | wc -l) files"
        echo "CENTRAL_MANIFEST: /tmp/$TASK_ID-central-baseline.json"
        cat "/tmp/$TASK_ID-central-baseline.json"
    output:
      mode: json
      schema:
        type: object
        description: Central baseline capture result — baseline_status 决定下游 baseline verify 步骤是否执行
        properties:
          baseline_status:
            type: string
            description: '"SUCCESS" | "DISABLED" | "FAIL"'
          task_id:
            type: integer
          captured_at:
            type: string
          worktree_path:
            type: string
          baseline_files:
            type: object
            description: 按 stage 分类的 baseline 文件路径清单
            properties:
              tdd:
                type: string
              review:
                type: string
              e2e:
                type: string
              verify:
                type: string
        required:
          - baseline_status
          - task_id
    depends_on:
      - setup-worktree

  - id: plan
    type: agent
    name: "Phase 3: Plan (brainstorming + writing-plans skills)"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
          description: Plan 阶段产物 — plan_doc 路径给 summary-report 引用；expected_traces 是 trace 闭环的起点
          properties:
            plan_doc:
              type: string
            estimated_files:
              type: array
              items:
                type: string
            tdd_test_count:
              type: integer
            risks:
              type: array
              items:
                type: string
            expected_traces:
              type: array
              description: 计划阶段识别的核心代码 trace 形状清单 — tdd-implement 据此加 @TracedAs，cli-e2e-test 据此对照实际 trace
              items:
                type: object
                properties:
                  function:
                    type: string
                    description: 完整限定名（ClassName.methodName 或 functionName）
                  file_path:
                    type: string
                    description: 绝对路径
                  span_name:
                    type: string
                    description: 用于 @TracedAs(name=...) 的自定义 span 名
                  record_params:
                    type: boolean
                  record_result:
                    type: boolean
                  key_params:
                    type: array
                    description: 关键入参字段路径（如 ["input.email", "options.region"]）
                    items:
                      type: string
                  key_result_fields:
                    type: array
                    description: 关键出参字段路径
                    items:
                      type: string
                  rationale:
                    type: string
                    description: 为什么这个函数值得打 trace（一句话）
            task_e2e_commands:
              type: array
              description: |
                任务相关的真实 CLI E2E 命令清单（与 expected_traces 并列）。
                每条是完整 bun 命令字符串（直接子命令 / interactive / act 三选一）。
                纯文档/chore 任务留空数组。
              default: []
              items:
                type: object
                properties:
                  command:
                    type: string
                    description: 完整 bun 命令（含 bun 前缀）
                  scenario:
                    type: string
                    description: '场景描述（auto-discovered from git diff / 直接子命令 / interactive / act）'
                  validation_method:
                    type: string
                    description: '"log" | "debug_trace" | "debug_span" | "combined"（缺省 "combined"）'
                  expected_signal:
                    type: string
                    description: log 模式要 grep 的关键字
          required:
            - plan_doc
            - estimated_files
            - tdd_test_count
            - risks
            - expected_traces
            - task_e2e_commands
      prompt: |
        ## Phase 3: Plan（设计与计划）

        工作目录: {{input.project_path}}/.worktrees/{{input.branch_name}}
        任务 ID: {{nodes.init-task.task_id}}
        任务类型: {{input.task_type}}
        分支: {{input.task_type}}/{{input.branch_name}}

        ### Step 3.0: 加载 skills（强制）
        - skill("brainstorming") — 设计先行，避免过早写代码
        - skill("writing-plans") — 结构化计划文档模板
        - 如果是 bug 修复：额外加载 skill("systematic-debugging") 做根因调查

        ### Step 3.1: 调研（必须有，不能跳过）
        - 用 glob / grep / read_file 探索 worktree 内相关代码
        - 读取 task_search 找到的相似任务（如 #1770, #1993, #1975, #1838, #1960）作为参考模式
        - 列出关键文件路径（必须精确到行号或符号）

        ### Step 3.2: 编写计划文档
        - 在 worktree 内创建 docs/superpowers/plans/<YYYY-MM-DD>-<topic>-plan.md
        - 必须包含以下小节：
            ## 目标
            ## 验收标准（至少 5 条可验证项）
            ## 涉及文件清单（精确路径）
            ## TDD 步骤（RED/GREEN/REFACTOR 具体内容）
            ## 风险与依赖
            ## 完成定义（DoD）

        ### Step 3.2.5: Trace 规划（核心新增 — trace 闭环起点）

        识别本次任务涉及的核心代码 / 核心流程，列出每个值得打 trace 的函数。

        判定标准（满足任一即为"核心"）：
        - 跨包/跨模块的入口函数（被多个调用方依赖）
        - 涉及 IO/网络/文件/数据库的关键路径
        - 业务关键路径上的转换/校验函数（参数错误易导致 silent failure）
        - 复杂算法入口（trace 用于回放与对照）

        对每个核心函数定义：
        - function: 完整限定名（ClassName.methodName 或 functionName）
        - file_path: worktree 内绝对路径
        - span_name: 自定义清晰的名字（用 @TracedAs('xxx.yyy', ...) 的第一个参数）
        - record_params: 是否记录入参（推荐 true，除非含敏感字段）
        - record_result: 是否记录出参（推荐 true，便于调试）
        - key_params / key_result_fields: 关键的字段路径列表（颗粒度：字段形状，不锁死具体值）
        - rationale: 一句话说明为什么

        ⚠️ 所有 trace 一律用 @TracedAs，不用 @Traced / @TracedLightweight。
        ⚠️ span_name 命名建议：domain.action（如 "user.create", "config.reload", "http.fetch"）

        如果本次任务**没有**核心代码可打 trace（例如纯文档/纯配置改动），expected_traces 写空数组 `[]` 并在 risks 中说明 "no core code changes, trace check skipped"。

        ### Step 3.3: 记录计划（扩充）
        - task_operation_create(
            action_type="milestone",
            action_title="PLAN completed: <one-line summary>",
            action_description=<plan_doc path + 关键决策点>
          )
        - 追加 task_operation_create(
            action_type="milestone",
            action_title="PLAN expected_traces: <N> items",
            action_description=<expected_traces 完整 JSON 数组>
          )
        - task_update(progress=15)

        ### Step 3.4: 任务相关 CLI E2E 规划（v1.2.0 新增）

        识别本次任务涉及的**真实 CLI 入口**（不只是 smoke 启动），列出每条需要执行的 E2E 命令。
        cli-e2e-test 节点的 Step 6.1.6 会按此清单执行并验证。

        **判定标准（满足任一即应列入 task_e2e_commands）**：
        - 本次任务**新增 / 修改了 CLI 子命令**（packages/cli/src/commands/ 下加新文件 / 改命令）
        - 本次任务**新增 / 修改了 interactive 模式入口**（cli.ts / interactive.ts）
        - 本次任务**新增 / 修改了 act 自然语言触发场景**（act command 的 trigger 解析逻辑）
        - 本次任务**改了 CLI 解析 / 输出格式**（参数解析、ansi 渲染、错误处理路径）
        - 本次任务**新增 / 修改了 debug 命令**（debug trace / debug span 等）

        **覆盖三类入口**（按本次任务实际改动类型挑）：

        1. **直接子命令**：
           ```bash
           bun packages/cli/dist/bin/roy-bot.js <command> [args]
           # 例：bun packages/cli/dist/bin/roy-bot.js tasks get 1
           ```

        2. **interactive 模式**：
           ```bash
           bun packages/cli/dist/bin/roy-bot.js interactive --es <scenario_name>
           ```

        3. **act 自然语言**：
           ```bash
           bun packages/cli/dist/bin/roy-bot.js act "<触发场景的指令>"
           ```

        对每条命令填：
        - command：完整 bun 命令字符串
        - scenario：场景描述（"auto-discovered from git diff" / "新增 X 子命令" / "修改 Y 参数解析" 等）
        - validation_method：`"log"` / `"debug_trace"` / `"debug_span"` / `"combined"`（缺省 `"combined"`）
        - expected_signal：log 模式要 grep 的关键字（如 "task created" / "interactive started"）

        **跳过条件**：纯文档 / 纯配置改动（无任何 CLI 代码改动）→ task_e2e_commands 写空数组 `[]`。
        cli-e2e-test 会自动跳过 Step 6.1.6（task_e2e_status = "PASS"），不影响整体判定。

        ### Step 3.5: 输出

        输出以下 JSON（系统会自动提取）：

        ```json
        {
          "plan_doc": "docs/superpowers/plans/<date>-<topic>-plan.md",
          "estimated_files": [<absolute paths>],
          "tdd_test_count": <预计写的失败测试数>,
          "risks": [<关键风险>],
          "expected_traces": [
            {
              "function": "ClassName.methodName",
              "file_path": "<absolute path>",
              "span_name": "domain.action",
              "record_params": true,
              "record_result": true,
              "key_params": ["input.email", "options.region"],
              "key_result_fields": ["status", "user.id"],
              "rationale": "跨包入口函数，参数错误易导致 silent failure"
            }
          ],
          "task_e2e_commands": [
            {
              "command": "bun packages/cli/dist/bin/roy-bot.js <command> [args]",
              "scenario": "<场景描述>",
              "validation_method": "log | debug_trace | debug_span | combined",
              "expected_signal": "<log 模式 grep 关键字>"
            }
          ]
        }
        ```

        - **不要**用普通文本输出
        ⚠️ 如果是 refactor 任务，必须明确写出 "保留什么 / 移除什么 / 重写什么" 三段，避免大爆炸重写。
    depends_on:
      - setup-worktree
  - id: tdd-implement
    type: agent
    name: "Phase 4: TDD 严格循环 (RED → GREEN → REFACTOR)"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
          description: TDD 循环结果 — tdd_status 决定下游分支（PASS→code-review / FAIL→self-loop 重做）；implemented_traces 验证 @TracedAs 落地
          properties:
            tdd_status:
              type: string
              description: '"PASS" 表示 TDD 循环完成可进入 review；"FAIL" 表示触发 self-loop 回环重做'
            test_count_added:
              type: integer
              description: 本次新增测试数
            test_count_passing:
              type: integer
              description: 通过的测试数
            pre_existing_failures:
              type: integer
              description: 已知 main 上的 pre-existing 失败数（不算回归）
            files_modified:
              type: array
              description: 修改的文件绝对路径列表
              items:
                type: string
            commits:
              type: array
              description: 本次提交的 commit hash 列表
              items:
                type: string
            blocking_findings_addressed:
              type: array
              description: |
                本轮 TDD 对 code-review 回环 blocking findings 的逐项处理报告。
                仅当本次为 back-edge re-entry（`nodes.code-review.review_status == "NEEDS_FIX"`）时填写；
                首次执行或 review PASS 时留空数组。每项含 id / status / note。
              items:
                type: object
                properties:
                  id:
                    type: string
                    description: finding 摘要或前 80 字符的简短 ID
                  status:
                    type: string
                    description: '"addressed" | "not_addressed" | "not_applicable"'
                  note:
                    type: string
                    description: 处理说明（做了什么 / 为什么未处理）
            implemented_traces:
              type: array
              description: 实际应用的 @TracedAs 列表 — 应与 plan 阶段 expected_traces 一一对应
              items:
                type: object
                properties:
                  function:
                    type: string
                  file_path:
                    type: string
                  span_name:
                    type: string
                  decorator:
                    type: string
                    description: '统一为 "@TracedAs"'
                  code_snippet:
                    type: string
                    description: 加注解那几行代码（最多 500 字符）
                  commit_hash:
                    type: string
                  matches_expected:
                    type: boolean
                    description: span_name 是否与 plan 阶段一致
          required:
            - tdd_status
            - test_count_added
            - test_count_passing
            - files_modified
            - commits
            - implemented_traces
          baseline_meta:
            type: object
            description: v1.4.0 + v1.5.0 — baseline/modified 元数据（v1.5.0 复用 capture-baseline 节点产物）
            properties:
              baseline_path:
                type: string
                description: baseline 文件路径（v1.5.0：从中央 manifest 读出）
              modified_path:
                type: string
              invocation_hash:
                type: string
              baseline_source:
                type: string
                description: '"central-manifest"（v1.5.0 新增 — 由 capture-baseline 节点提供）'
            new_regressions:
              type: object
              description: v1.4.0 + v1.5.0 — baseline 外新增稳定 failure/warning ID
      prompt: >
        ## Phase 4: TDD 严格循环


        工作目录: {{input.project_path}}/.worktrees/{{input.branch_name}}

        任务 ID: {{nodes.init-task.task_id}}


        ### Step 4.0: 加载 skills（强制）

        - skill("test-driven-development") — TDD 铁律：先 RED 再 GREEN 再 REFACTOR

        - skill("verification-before-completion") — 完成前必须跑测试验证


        ### Step 4.0.4: Back-edge re-entry feedback（强制，如适用）

        本节点可能被 4 种 back-edge 触发重新执行（source output 已由 engine 通过 back-edge
        source-preserve filter 保留，因此 `{{nodes.<source-id>.<field>}}` 模板可直接消费上一轮输出）：

        - **a) self-loop**：上次 tdd-implement 自己 FAIL → 本节点重做
        - **b) code-review**：review_status == NEEDS_FIX → 本节点修复 blocking 后重做
        - **c) cli-e2e-test**：cli_e2e_status == FAIL → 本节点修复 build/test/cli_smoke/trace_check 后重做
        - **d) final-verify**：verify_status == FAIL → 本节点修复 9 项 checklist 失败项后重做

        **首次执行时**（`{{nodes.tdd-implement.tdd_status}}` 不存在），跳过整个 4.0.4 节，
        `blocking_findings_addressed` 留空数组 `[]`。

        ---

        #### Step 4.0.4.a: self-loop（tdd-implement → tdd-implement，FAIL→self）

        - **检测**：`{{nodes.tdd-implement.tdd_status}} == 'FAIL'`（首次执行时该变量不存在）
        - **处理**：
          - 读取本节点上一轮 output：`fail_reason` / `pre_existing_failures` / `test_count_passing`
            / `test_count_failed` 等字段，分析上次为何 fail。
          - 如 fail_reason 指向具体测试名 / 文件，本轮必须针对修复并新增 commit。
          - 如 fail_reason 为 "no progress: HEAD unchanged ..."（说明上一轮已触发自约束并主动 FAIL），
            必须彻底改变修复策略（不能重复同一尝试）。
        - **自约束（防 10 次空转）**：
          - 如果 `git rev-parse HEAD` 与上一轮 output `commits[]` 最后一项 commit **相同**，且
            `fail_reason` 描述的失败仍然存在：
            **`tdd_status` 必须为 "FAIL"**，并在 output `fail_reason` 中说明
            "no progress: HEAD unchanged after self-loop re-entry"。

        ---

        #### Step 4.0.4.b: code-review → tdd-implement（NEEDS_FIX）

        - **检测**：`{{nodes.code-review.review_status}}` 存在且 == "NEEDS_FIX"
        - **处理**：
          - 拉取最近一次 review op：`task_operation_list(task_id=<task_id>, action_type="review",
            limit=1)`，从最近一条 op 的 `action_description` 取出完整 review JSON（schema 字段见
            Step 5.3：`review_status` / `severity.{blocking,important,minor,nit}` / `recommendation`
            / `commits_reviewed`）。
          - 必须显式读取并处理：
            - `severity.blocking` — 逐项解决或标注 not_applicable
            - `severity.important` / `severity.minor` — 尽力处理
            - `recommendation` — 改进建议
            - `commits_reviewed` — 之前 review 的 commit 列表
          - 对每条 `blocking` finding，本轮必须：
            1. 实际写代码 / 加测试修复，commit 形成新 SHA；或
            2. 在 Step 4.5 输出 schema 的 `blocking_findings_addressed` 数组里逐项报告：
               `{"id": "<finding 摘要或前 80 字符>", "status": "addressed|not_addressed|not_applicable", "note": "<做了什么>"}`
        - **自约束（防 10 次空转）**：
          - 如果 `git rev-parse HEAD` 与 `commits_reviewed` 最新 commit **相同**，且
            `severity.blocking` 仍非空、且未在 `blocking_findings_addressed` 中全部标
            `addressed` 或 `not_applicable`：
            **`tdd_status` 必须为 "FAIL"**，禁止 PASS；并在 output `fail_reason` 中说明
            "no progress: HEAD unchanged after review feedback consumed but no commits added"。

        ---

        #### Step 4.0.4.c: cli-e2e-test → tdd-implement（FAIL）

        - **检测**：`{{nodes.cli-e2e-test.cli_e2e_status}} == 'FAIL'`
        - **处理**：
          - 通过 `task_operation_list(task_id=<task_id>, action_type="milestone", limit=10)`
            找 `action_title` 含 "CLI E2E:" 的 milestone，解析 `action_description` 取得上一轮
            完整 JSON（schema 字段见 Step 6.2：`cli_e2e_status` / `build_ok` / `build_exit_code` /
            `test_ok` / `test_exit_code` / `cli_smoke_ok` / `cli_smoke_exit_code` / `fail_reason` /
            `build_log_tail` / `test_log_tail` / `cli_log_tail` / `trace_check_status` /
            `trace_check_failures`）。
          - 读取 `fail_reason` 定位失败阶段：
            - `"build failed"` → 修复编译错误（看 `build_log_tail`）
            - `"test failed"` → 修复失败的测试（看 `test_log_tail`）
            - `"cli smoke failed"` → 修复 CLI 启动 / `--help` 行为（看 `cli_log_tail`）
            - `"trace check failed"` → 给缺漏的 expected_trace 补 `@TracedAs` decorator（看
              `trace_check_failures` 逐项）
          - 如果 `trace_check_status == 'FAIL'`，每条 finding 必须在本轮修复（参考 4.0.4.b 的
            blocking 处理模式），输出到 `blocking_findings_addressed` 数组：
            `{"id": "<expected_span_name>", "status": "addressed|not_applicable", "note": "..."}`
          - 必须实际修复并形成新 commit，否则 `tdd_status` 必须为 "FAIL"。
        - **自约束（防 10 次空转）**：
          - 如果 `git rev-parse HEAD` 与本节点上一轮 output `commits[]` 最后一项 commit **相同**，
            且 `cli_e2e_status` 仍 FAIL：
            **`tdd_status` 必须为 "FAIL"**，并在 output `fail_reason` 中说明
            "no progress: HEAD unchanged after cli-e2e FAIL consumed but no commits added"。

        ---

        #### Step 4.0.4.d: final-verify → tdd-implement（FAIL）

        - **检测**：`{{nodes.final-verify.verify_status}} == 'FAIL'`
        - **处理**：
          - 通过 `task_operation_list(task_id=<task_id>, action_type="review", limit=10)`
            找 `action_title` 含 "Final verify:" 的 review op，解析 `action_description` 取得上一轮
            完整 JSON（schema 字段见 Step 7.6：`verify_status` / `checklist` 9 项布尔 /
            `failed_items` 数组 / `evidence` 含 `build_exit_code` / `test_exit_code` /
            `cli_smoke_exit_code` / `trace_re_verified_spans` / `spans_db_path`）。
          - 读取 `failed_items` 列出具体失败 checklist 项（共 9 项：`goals_verified` /
            `plan_doc_verified` / `evidence_collected` / `no_obvious_issues` / `review_passed` /
            `build_passes` / `tests_pass` / `cli_smoke_passes` / `trace_re_verified`）。
          - 读取 `checklist` 9 项逐项状态，对 `false` 项针对性修复。
          - 读取 `evidence` — `build_exit_code` / `test_exit_code` / `cli_smoke_exit_code` 非零即失败。
          - 必须实际修复并形成新 commit，否则 `tdd_status` 必须为 "FAIL"。
        - **自约束（防 10 次空转）**：
          - 如果 `git rev-parse HEAD` 与本节点上一轮 output `commits[]` 最后一项 commit **相同**，
            且 `verify_status` 仍 FAIL：
            **`tdd_status` 必须为 "FAIL"**，并在 output `fail_reason` 中说明
            "no progress: HEAD unchanged after final-verify FAIL consumed but no commits added"。

        ---

        **字段可用性说明**：4.0.4.b / 4.0.4.c / 4.0.4.d 中，source node 的输出由 engine 通过
        back-edge source-preserve filter 保证可见（见 engine.ts 1405-1415），可使用
        `{{nodes.<source-id>.<field>}}` 模板直接读取。如个别字段因 schema 演化缺失，**退化**为
        `task_operation_list` + 解析 `action_description` JSON 的方式获取（已在每节"处理"中
        给出 fallback 命令）。


        ### Step 4.1: RED（先写失败测试）

        - 在 worktree 内写至少 1 个失败测试（推荐 2-3 个，覆盖边界）

        - 跑测试确认失败 — 必须是功能缺失的失败，不是 typo 错

        - task_operation_create(action_type="progress", action_title="RED:
        failing test added")

        - task_update(progress=30)


        ### Step 4.2: GREEN（最小代码让测试通过）

        - 实现最小代码（不要 over-engineer）

        - 跑测试确认通过

        - task_operation_create(action_type="progress", action_title="GREEN:
        minimal fix implemented")

        - task_update(progress=50)


        ### Step 4.3: REFACTOR

        - 提取辅助函数 / 改进命名 / 移除死代码

        - 测试保持绿色（每次 refactor 后跑一次）

        - task_operation_create(action_type="milestone", action_title="REFACTOR complete")

        - task_update(progress=65)

        ### Step 4.3.5: Trace 落地（核心新增 — @TracedAs 应用）

        读取 plan 阶段的 expected_traces：
        - 通过 `task_operation_list(task_id=<task_id>)` 找 `action_title="PLAN expected_traces: ..."` 的 milestone，提取 `action_description` 中的 JSON 数组。
        - 如果 expected_traces 为空数组（纯文档/纯配置任务），跳过本步骤，implemented_traces 留空数组。

        对每个 expected_trace，在对应函数上加 @TracedAs 注解：
        - 导入路径：实际项目里 `packages/core` 的导出路径（推荐用 grep/read_file 确认 import 形态，常见 `from "@/env/log-trace/decorator"` 或 `from "../../env/log-trace/decorator"`）。
        - 用法：
          ```ts
          import { TracedAs } from "<实际路径>";

          @TracedAs('<span_name>', { recordParams: <bool>, recordResult: <bool> })
          public async <name>(...): Promise<...> { ... }
          ```
        - ⚠️ span_name 必须与 expected_traces 完全一致（用于 cli-e2e 对照）
        - ⚠️ 如果原函数已有 `@Traced` 或 `@TracedLightweight`，**替换**为 `@TracedAs` 并用 expected_traces 里的 span_name 作为 name 参数
        - ⚠️ 禁止新增 `@Traced` / `@TracedLightweight`（统一 `@TracedAs`）

        如果 plan 中某个 expected_trace 因技术原因无法实现（如函数不存在/已重构），在 implemented_traces 中仍记录，但 `matches_expected: false` 并在 code_snippet 写明原因（如 "function removed in refactor"）。

        - task_update(progress=70)

        ### ⚡ Bun test 提示（统一使用 --parallel=4）

        本项目 `bun test` **统一使用 `--parallel=4` 模式**：

        ```bash
        bun test <package_path> --parallel=4
        # 例：bun test packages/core --parallel=4
        # 例：bun test packages/cli --parallel=4
        # 例：bun test tests/cli --parallel=4
        ```

        **📌 关键约束：必须先跑 baseline，再跑修改后**

        1. **跑 baseline（main 分支基线）**：
           - checkout 到 main 或 `git stash` 暂存所有修改
           - 跑 `bun test <package_path> --parallel=4`
           - 记录 baseline 失败列表（fail_test_names）和通过数

        2. **跑修改后测试**：
           - 恢复你的修改（或重新跑）
           - 跑 `bun test <package_path> --parallel=4`
           - 记录修改后失败列表和通过数

        3. **对比判定**：
           - ✅ PASS：修改后失败列表 == baseline 失败列表（甚至更少）
           - ❌ FAIL：修改后引入了 baseline 没有的新失败

        **重要原则**：
        - 只看"是否引入新错误"，不要被 baseline 已有的失败误导
        - baseline 已存在的失败是已知的，不算 regression
        - 如果不确定，先跑一次 baseline 确认 pre-existing 失败列表


        ### Step 4.3.6: Baseline regression 验证（v1.4.0 + v1.5.0 核心 — 读中央 manifest）

        仅当 `{{input.baseline_regression_enabled}}` == "true" 时执行。
        baseline 已由 capture-baseline 节点集中捕获（/tmp/$TASK_ID-central-baseline.json），
        本节点只需 capture modified + 读中央 baseline verify。

        **步骤 1 — 读中央 manifest 取 baseline 路径**：
        ```bash
        TASK_ID="{{nodes.init-task.task_id}}"
        if [ ! -f "/tmp/$TASK_ID-central-baseline.json" ]; then
          echo "ERROR: central baseline manifest not found (capture-baseline node 失败?)"
          exit 1
        fi
        BASELINE_FILE=$(jq -r .baseline_files.tdd /tmp/$TASK_ID-central-baseline.json)
        ```

        **步骤 2 — Capture modified（仅 modified；不重新 capture baseline）**：
        ```bash
        mkdir -p reports/
        python3 scripts/capture_roy_rd_baseline.py \
          --stage tdd \
          --category test,lint,typecheck \
          --task-id "$TASK_ID" \
          --out reports/$TASK_ID-tdd-modified-failures.json
        ```

        **步骤 3 — Verify set-diff**：
        ```bash
        python3 scripts/verify_roy_rd_baseline.py \
          --baseline "$BASELINE_FILE" \
          --modified reports/$TASK_ID-tdd-modified-failures.json
        ```
        `new_regressions[category] = sorted(modified.failures[category]) - sorted(baseline.failures[category])`。

        **步骤 4 — Fail-Closed Rules**：
        - 读不到 central manifest → tdd_status = "FAIL"
        - baseline 文件不存在 / 损坏 / parse fail → tdd_status = "FAIL"
        - invocation_hash 不一致 → tdd_status = "FAIL"
        - modified 缺失 baseline 存在的 category key → tdd_status = "FAIL"
        - capture exit 非零但 modified.failures 为空 → tdd_status = "FAIL"
        - 跨 worktree 切换 / capture timeout → tdd_status = "FAIL"

        **绝对零失败不是 PASS 条件**；pre-existing failures 不阻断；只看 baseline 外新增稳定 ID。
        invocation_hash 兼容性由 capture-baseline 节点保证（同 stage + 同 categories → 相同 hash）。

        **对比 v1.4.0**：
        - v1.4.0：本节点既跑 baseline capture 又跑 modified capture（2 次）
        - v1.5.0：本节点只跑 modified capture（1 次），baseline 复用 capture-baseline 节点产物
        - 节省时间：~50%（避免 baseline 在 4 个节点重复 capture）

        ### Step 4.4: 跑全套测试 + 记录（扩充）

        - 执行 {{input.test_command}}

        - 记录新增失败 vs pre-existing failures（已知 main 上存在的失败不算回归）

        - task_operation_create(
            action_type="milestone",
            action_title="TDD cycle complete",
            action_description="新增 <N> 测试，<M> 通过，<K> pre-existing failures 已文档化"
          )

        - 追加 task_operation_create(
            action_type="milestone",
            action_title="TDD implemented_traces: <N> @TracedAs applied",
            action_description=<implemented_traces 完整 JSON 数组>
          )

        ### Step 4.5: 输出

        输出以下 JSON（系统会自动提取，**这是触发 loop 机制的关键**）：

        ```json

        {
          "tdd_status": "PASS" | "FAIL",
          "test_count_added": <n>,
          "test_count_passing": <n>,
          "pre_existing_failures": <n>,
          "files_modified": [<absolute paths>],
          "commits": [<commit hashes>],
          "blocking_findings_addressed": [
            {
              "id": "<finding 摘要或前 80 字符>",
              "status": "addressed|not_addressed|not_applicable",
              "note": "<做了什么 / 为什么未处理>"
            }
          ],
          "implemented_traces": [
            {
              "function": "ClassName.methodName",
              "file_path": "<absolute path>",
              "span_name": "domain.action",
              "decorator": "@TracedAs",
              "code_snippet": "@TracedAs('domain.action', { recordParams: true, recordResult: true })\npublic async methodName(...) {...}",
              "commit_hash": "<hash>",
              "matches_expected": true
            }
          ]
        }

        ```

        - `tdd_status` 决定下游分支："PASS" → 进入 code-review；"FAIL" → 触发 self-loop 回环到
        tdd-implement 重做

        - `implemented_traces` 是 cli-e2e-test 节点的对照清单（expected ↔ actual）

        - `blocking_findings_addressed` 仅在 back-edge re-entry 时填写；首次执行或 review PASS
          时留空数组 []。


        ⚠️ 铁律：每个 commit 必须 atomic、独立可 revert、message 遵守 feat:/fix:/refactor: 前缀。
    depends_on:
      - plan
  - id: code-review
    type: agent
    name: "Phase 5: Code Review (BLOCKING/IMPORTANT/MINOR/NIT 分级)"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
          description: Code review 结果 — review_status 决定下游分支（PASS→cli-e2e-test /
            NEEDS_FIX→tdd-implement 修复）
          properties:
            review_status:
              type: string
              description: '"PASS" 表示 review 通过；"NEEDS_FIX" 表示有 blocking 问题，触发回环到
                tdd-implement'
            severity:
              type: object
              properties:
                blocking:
                  type: array
                  items:
                    type: string
                important:
                  type: array
                  items:
                    type: string
                minor:
                  type: array
                  items:
                    type: string
                nit:
                  type: array
                  items:
                    type: string
            test_coverage:
              type: string
            api_design:
              type: string
            recommendation:
              type: string
            commits_reviewed:
              type: array
              items:
                type: string
          required:
            - review_status
            - severity
            - commits_reviewed
          baseline_meta:
            type: object
            description: v1.4.0 + v1.5.0 — baseline/modified 元数据（v1.5.0 复用 capture-baseline 节点产物）
            properties:
              baseline_path:
                type: string
                description: baseline 文件路径（v1.5.0：从中央 manifest 读出）
              modified_path:
                type: string
              invocation_hash:
                type: string
              baseline_source:
                type: string
                description: '"central-manifest"（v1.5.0 新增 — 由 capture-baseline 节点提供）'
            new_regressions:
              type: object
              description: v1.4.0 + v1.5.0 — baseline 外新增稳定 failure/warning ID
      prompt: >
        ## Phase 5: Code Review


        工作目录: {{input.project_path}}/.worktrees/{{input.branch_name}}

        任务 ID: {{nodes.init-task.task_id}}

        对比基准: {{input.base_branch}}...HEAD


        ### Step 5.0: 加载 skills（强制）

        - skill("requesting-code-review") — review checklist + 输出格式


        ### Step 5.1: 收集 diff

        - `git diff {{input.base_branch}}...HEAD --stat` — 文件级改动统计

        - `git diff {{input.base_branch}}...HEAD` — 实际代码改动

        - `git log {{input.base_branch}}..HEAD --oneline` — commit 列表


        ### Step 5.2: 审查维度

        - **功能正确性**：是否满足 plan 文档中的所有验收标准？

        - **测试覆盖**：是否有 RED 测试 / 边界用例 / 反向断言？

        - **API 设计**：命名清晰 / 参数合理 / 向后兼容？

        - **代码质量**：类型安全 / 错误处理 / 无死代码 / 无遗留 TODO？

        - **文档同步**：plan 文档 / README / JSDoc 是否同步更新？

        - **铁律检查**：未直接 commit 到 main / 未破坏既有测试 / commit message 合规？


        ### ⚡ Bun test 提示（统一使用 --parallel=4）

        本项目 `bun test` **统一使用 `--parallel=4` 模式**：

        ```bash
        bun test <package_path> --parallel=4
        # 例：bun test packages/core --parallel=4
        # 例：bun test packages/cli --parallel=4
        # 例：bun test tests/cli --parallel=4
        ```

        **📌 关键约束：必须先跑 baseline，再跑修改后**

        1. **跑 baseline（main 分支基线）**：
           - checkout 到 main 或 `git stash` 暂存所有修改
           - 跑 `bun test <package_path> --parallel=4`
           - 记录 baseline 失败列表（fail_test_names）和通过数

        2. **跑修改后测试**：
           - 恢复你的修改（或重新跑）
           - 跑 `bun test <package_path> --parallel=4`
           - 记录修改后失败列表和通过数

        3. **对比判定**：
           - ✅ PASS：修改后失败列表 == baseline 失败列表（甚至更少）
           - ❌ FAIL：修改后引入了 baseline 没有的新失败

        **重要原则**：
        - 只看"是否引入新错误"，不要被 baseline 已有的失败误导
        - baseline 已存在的失败是已知的，不算 regression
        - 如果不确定，先跑一次 baseline 确认 pre-existing 失败列表


        ### Step 5.2.6: Baseline regression 复审（v1.4.0 + v1.5.0 核心 — 读中央 manifest）

        仅当 `{{input.baseline_regression_enabled}}` == "true" 时执行。
        baseline 已由 capture-baseline 节点集中捕获，本节点只 capture modified + 读中央 verify。

        **步骤 1 — 读中央 manifest 取 baseline 路径**：
        ```bash
        TASK_ID="{{nodes.init-task.task_id}}"
        BASELINE_FILE=$(jq -r .baseline_files.review /tmp/$TASK_ID-central-baseline.json)
        ```

        **步骤 2 — Capture modified（test category）**：
        ```bash
        python3 scripts/capture_roy_rd_baseline.py \
          --stage review \
          --category test \
          --task-id "$TASK_ID" \
          --out reports/$TASK_ID-review-modified-failures.json
        ```

        **步骤 3 — Verify set-diff**：
        ```bash
        python3 scripts/verify_roy_rd_baseline.py \
          --baseline "$BASELINE_FILE" \
          --modified reports/$TASK_ID-review-modified-failures.json
        ```
        `new_regressions[test] = sorted(modified.test) - sorted(baseline.test)`。
        非空 → 每个 ID 追加 "regression: test:<id>" 到 severity.blocking。

        **步骤 4 — Fail-Closed Rules**：
        - 读不到 central manifest / baseline 文件缺失 / 损坏 → review_status = "NEEDS_FIX"
        - invocation_hash 不一致 → review_status = "NEEDS_FIX"
        - capture exit 非零但 modified.failures 为空 → review_status = "NEEDS_FIX"

        **绝对零失败不是 PASS 条件**；pre-existing failures 不阻断。
        invocation_hash 兼容性由 capture-baseline 节点保证。

        ### Step 5.3: 分级输出

        输出以下 JSON（系统会自动提取，**这是触发 loop 机制的关键**）：

        ```json

        {
          "review_status": "PASS" | "NEEDS_FIX",
          "severity": {
            "blocking": [<必须立即修，否则阻断 merge 的问题>],
            "important": [<应该修，但可以后续 PR>],
            "minor": [<建议改进，不影响功能>],
            "nit": [<纯风格 nit>]
          },
          "test_coverage": "<评估>",
          "api_design": "<评估>",
          "recommendation": "<改进建议或放行声明>",
          "commits_reviewed": [<commit hashes>]
        }

        ```

        - `review_status` 决定下游分支："PASS" → 进入 cli-e2e-test；"NEEDS_FIX" → 回环到
        tdd-implement 重做


        ### Step 5.4: 记录

        - task_operation_create(
            action_type="review",
            action_title="Code review: <status>",
            action_description=<完整 JSON>
          )
        - task_update(progress=75)


        ### 关键规则

        - 如果 blocking 数组非空 → review_status = "NEEDS_FIX"，下游 final-verify
        节点会判定为失败并触发 loop back 到 tdd-implement

        - 如果仅 important 数组非空 → review_status = "PASS"，但应在 summary 报告里记录为
        follow-up

        - 否则 → review_status = "PASS"
    depends_on:
      - tdd-implement
  - id: cli-e2e-test
    type: agent
    name: "Phase 6: CLI E2E (build + unit tests + CLI smoke)"
    config:
