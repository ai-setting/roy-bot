name: roy-rd-pipeline
version: "1.3"
description: >
  统一的 R&D 研发工作流 — 支持 feature / bug / refactor 三大任务类型。


  包含 9 个独立节点（串行执行，保证每阶段产物被下阶段读取）。

  阶段 5"修复问题"是阶段 4 的失败回环（loop back），不是独立节点。
    Phase 1  init-task         — 任务管理（task_search 找相似 + task_create + task_update active）
    Phase 2  setup-worktree    — Worktree 隔离（git worktree add，幂等检查避免重复创建）
    Phase 3  plan              — 设计与计划（brainstorming + writing-plans skills，输出 plan doc）
    Phase 4  tdd-implement     — TDD 严格循环（RED → GREEN → REFACTOR，test-driven-development skill；含 bun test 4 并发加速提示）
    Phase 5  code-review       — Code Review（requesting-code-review skill，输出 BLOCKING/IMPORTANT/MINOR/NIT 分级；含 bun test 4 并发加速提示）
    Phase 6  cli-e2e-test      — 命令行级 E2E（agent: roy 调 bash 跑 build + unit tests + CLI smoke；提交 JSON 输出 cli_e2e_status）
    Phase 7  final-verify      — 最终验证（verification-before-completion skill，8 项 checklist；含 bun test 4 并发加速提示）
    Phase 8  merge-to-main     — 可选合并（agent: roy 调 bash 执行 git merge；auto_merge 必须显式 "true" 才执行；冲突自动 rebase；merge 后跑 build/test 验证 main 未被破坏；提交 JSON 输出 merge_status）
    Phase 9  summary-report    — 总结报告（写入 reports/<task_id>-rd-summary.md + task_complete）

  v1.3 baseline regression testing：tdd-implement / code-review / cli-e2e-test / final-verify 在修改前持久化 baseline，在修改后用同一命令集合做 category-wise set-diff；pre-existing test/lint/typecheck/build/CLI smoke failures 不阻断，新增稳定 failure ID 才判定 regression。JSON capture 缺失、损坏、命令集合漂移、跨 worktree 或无法解析的非零退出均 fail-closed。

  ⚠️ 合并主分支铁律：
    - merge-to-main 节点的 `auto_merge` 参数必须显式为 "true" 才执行 merge
    - 默认 "false"，节点会跳过 merge 并输出 MERGE_SKIPPED
    - 即使 auto_merge=true，merge 前必须用 git merge-tree 预检冲突，冲突时自动 rebase 解决
    - merge 后必须跑 build/test 验证 main 仍健康，否则回滚
    - worktree 保留（不清理），等用户最终验收

  与现有 workflow 的区别：
    - feature-development: 缺 plan 节点、缺 code-review、merge-and-cleanup 不预检冲突
    - feature-implementation / bug-investigation: 4 节点 PLAN/EXECUTE/VERIFY 模型，缺 worktree 隔离、CLI 级 e2e、可控 merge
    - strict-task-agent-v522: 通用 PLAN/EXECUTE/VERIFY + resume gate，不是 R&D 专用模板

  使用场景：所有 R&D 任务（feature / bug fix / refactor）均推荐使用此 workflow。
config:
  parallel_limit: 1
  timeout: 1800000
  maxIterations: 10
  loopEnabled: true
nodes:
  - id: init-task
    type: agent
    name: "Phase 1: 任务管理 (task_search → task_create → task_update active)"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
          description: 任务管理结果 — task_id 给后续节点使用
          properties:
            task_id:
              type: integer
            task_type:
              type: string
            branch:
              type: string
            worktree_path:
              type: string
            similar_tasks_referenced:
              type: array
              items:
                type: integer
          required:
            - task_id
            - task_type
            - branch
            - worktree_path
      prompt: >
        ## Phase 1: 任务管理


        任务类型: {{input.task_type}}

        任务标题: {{input.task_title}}

        任务描述: {{input.task_description}}


        ### Step 1.1: 搜索相似任务（强建议）

        - 调用 task_search(keywords=["{{input.task_type}}",
        "{{input.branch_name}}"], limit=5) 找相似历史任务

        - 如果找到（如 #1770 plugin emit notification / #1993 install package-json /
        #1975 ask-user-timeout），
          在 task description 里追加引用 "参考任务: #XXX, #YYY"，供后续节点阅读
        - 推荐相似任务模式（来自上一周 R&D 实践）：
            - Feature: 多子任务（T-A 到 T-H），TDD + 集成测试 + build
            - Bug fix: 根因调查 → RED 失败测试 → GREEN 最小修复 → CLI 实际复现 → build
            - Refactor: 移除旧机制 + 重写 + typecheck + build 验证

        ### Step 1.2: 创建任务

        - 调用 task_create(
            title="{{input.task_title}}",
            description="{{input.task_description}}",
            type="normal",
            priority="{{input.task_priority}}",
            tags=["{{input.task_type}}", "rd-pipeline", "{{input.branch_name}}"{{#if input.task_tags}}, {{input.task_tags}}{{/if}}]
          )
        - task_update(status="active", progress=5)

        - task_operation_create(action_type="create", action_title="Task created
        via roy-rd-pipeline v1.2")


        ### Step 1.3: 写入 context（关键，给后续节点用）

        - 调用 task_update(
            task_id=<返回的 task_id>,
            context='{"worktree_path": "{{input.project_path}}/.worktrees/{{input.branch_name}}",
                      "branch": "{{input.task_type}}/{{input.branch_name}}",
                      "task_type": "{{input.task_type}}",
                      "base_branch": "{{input.base_branch}}",
                      "pipeline_version": "1.0"}'
          )

        ### Step 1.4: 输出（CRITICAL — 必须调用 workflow_submit_output）

        调用 `workflow_submit_output` 工具提交以下 JSON（**workflow engine 只会解析 workflow_submit_output 提交的 JSON**）：

        ```json

        {
          "task_id": <number>,
          "task_type": "{{input.task_type}}",
          "branch": "{{input.task_type}}/{{input.branch_name}}",
          "worktree_path": "{{input.project_path}}/.worktrees/{{input.branch_name}}",
          "similar_tasks_referenced": [<task_ids>]
        }

        ```

        - `task_id` 是后续所有节点读取任务状态的核心 ID
        - **不要**用普通文本输出
    depends_on: []
  - id: setup-worktree
    type: tool
    name: "Phase 2: Worktree 隔离 (git worktree add，幂等检查)"
    config:
      tool: bash
      command: >
        set -euo pipefail

        cd {{input.project_path}}


        BRANCH="{{input.task_type}}/{{input.branch_name}}"

        WORKTREE_PATH=".worktrees/{{input.branch_name}}"


        # 幂等检查：worktree 已存在则跳过

        if git worktree list | grep -q "$WORKTREE_PATH"; then
          echo "WORKTREE_EXISTS: $WORKTREE_PATH"
          echo "BRANCH: $BRANCH"
          exit 0
        fi


        # 验证 base_branch 存在

        if ! git rev-parse --verify "{{input.base_branch}}" >/dev/null 2>&1;
        then
          echo "ERROR: base_branch '{{input.base_branch}}' not found"
          exit 1
        fi


        # 验证 branch 不与现有分支冲突

        if git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then
          echo "ERROR: branch '$BRANCH' already exists; pick a different branch_name"
          exit 2
        fi


        git worktree add "$WORKTREE_PATH" -b "$BRANCH" "{{input.base_branch}}"

        echo "WORKTREE_CREATED: $WORKTREE_PATH"

        echo "BRANCH: $BRANCH"

        echo "BASE: {{input.base_branch}}"
    depends_on:
      - init-task
  - id: plan
    type: agent
    name: "Phase 3: Plan (brainstorming + writing-plans skills)"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
          description: Plan 阶段产物 — plan_doc 路径给 summary-report 引用
          properties:
            plan_doc:
              type: string
            estimated_files:
              type: array
              items:
                type: string
            tdd_test_count:
              type: integer
            risks:
              type: array
              items:
                type: string
          required:
            - plan_doc
            - estimated_files
            - tdd_test_count
            - risks
      prompt: |
        ## Phase 3: Plan（设计与计划）

        工作目录: {{input.project_path}}/.worktrees/{{input.branch_name}}
        任务 ID: <init-task 节点返回的 task_id>
        任务类型: {{input.task_type}}
        分支: {{input.task_type}}/{{input.branch_name}}

        ### Step 3.0: 加载 skills（强制）
        - skill("brainstorming") — 设计先行，避免过早写代码
        - skill("writing-plans") — 结构化计划文档模板
        - 如果是 bug 修复：额外加载 skill("systematic-debugging") 做根因调查

        ### Step 3.1: 调研（必须有，不能跳过）
        - 用 glob / grep / read_file 探索 worktree 内相关代码
        - 读取 task_search 找到的相似任务（如 #1770, #1993, #1975, #1838, #1960）作为参考模式
        - 列出关键文件路径（必须精确到行号或符号）

        ### Step 3.2: 编写计划文档
        - 在 worktree 内创建 docs/superpowers/plans/<YYYY-MM-DD>-<topic>-plan.md
        - 必须包含以下小节：
            ## 目标
            ## 验收标准（至少 5 条可验证项）
            ## 涉及文件清单（精确路径）
            ## TDD 步骤（RED/GREEN/REFACTOR 具体内容）
            ## 风险与依赖
            ## 完成定义（DoD）

        ### Step 3.3: 记录计划
        - task_operation_create(
            action_type="milestone",
            action_title="PLAN completed: <one-line summary>",
            action_description=<plan_doc path + 关键决策点>
          )
        - task_update(progress=15)

        ### Step 3.4: 输出（CRITICAL — 必须调用 workflow_submit_output）

        调用 `workflow_submit_output` 工具提交以下 JSON（**workflow engine 只会解析 workflow_submit_output 提交的 JSON**）：

        ```json
        {
          "plan_doc": "docs/superpowers/plans/<date>-<topic>-plan.md",
          "estimated_files": [<absolute paths>],
          "tdd_test_count": <预计写的失败测试数>,
          "risks": [<关键风险>]
        }
        ```

        - **不要**用普通文本输出
        ⚠️ 如果是 refactor 任务，必须明确写出 "保留什么 / 移除什么 / 重写什么" 三段，避免大爆炸重写。
    depends_on:
      - setup-worktree
  - id: tdd-implement
    type: agent
    name: "Phase 4: TDD 严格循环 (RED → GREEN → REFACTOR)"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
          description: TDD 循环结果 — tdd_status 决定下游分支（PASS→code-review / FAIL→self-loop 重做）
          properties:
            tdd_status:
              type: string
              description: '"PASS" 表示 RED→GREEN 新增测试通过且 test/lint/typecheck 均无 baseline 外新增 regression；pre-existing failures 可保留；"FAIL" 表示新增 regression 或 capture fail-closed，触发 self-loop'
            test_count_added:
              type: integer
              description: 本次新增测试数
            test_count_passing:
              type: integer
              description: 通过的测试数
            pre_existing_failures:
              type: integer
              description: 已知 main 上的 pre-existing 失败数（不算回归）
            files_modified:
              type: array
              description: 修改的文件绝对路径列表
              items:
                type: string
            commits:
              type: array
              description: 本次提交的 commit hash 列表
              items:
                type: string
            baseline_meta:
              type: object
              description: v1.3 baseline/modified capture 元数据与 set-diff 摘要（可选但若运行校验必须填写）
              properties:
                baseline_path:
                  type: string
                modified_path:
                  type: string
                invocation_hash:
                  type: string
                new_regressions:
                  type: object
                modified_unchanged_count:
                  type: integer
                modified_newly_fixed_count:
                  type: integer
          required:
            - tdd_status
            - test_count_added
            - test_count_passing
            - files_modified
            - commits
      prompt: >
        ## Phase 4: TDD 严格循环


        工作目录: {{input.project_path}}/.worktrees/{{input.branch_name}}

        任务 ID: <init-task 节点返回的 task_id>


        ### ⚡ Baseline regression testing protocol（v1.3 铁律）

        本节点使用 baseline set-diff 评估 test/lint/typecheck/build/CLI smoke：
        - **绝对零失败不是 PASS 条件**；pre-existing failures 不算 regression。
        - 只看"是否引入 baseline 没有的新稳定失败"。
        - 支持的 category（5 类）：`"test"` / `"lint"` / `"typecheck"` / `"build"` / `"cli-smoke"`。
        - 真实功能/安全/代码审查 BLOCKING 问题仍照常阻断；本协议只豁免 pre-existing 测试/lint/类型/build/smoke 噪声。

        #### 步骤 A — Capture baseline（改代码前；同一 worktree / 同 branch / 同 task_id）

        1. `mkdir -p reports/`
        2. 调用 capture 脚本（stage 与 category 由本节点专属 Step 指定；详见下方 Step 4.3.5）：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage <stage> \
             --category <category_csv> \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-<tag>-baseline.json
           ```
        3. 若 baseline.json 已存在 / schema 损坏 / task_id / worktree_path / invocation_hash 不一致 → task_operation_create(action_type="problem") → 终止本节点。self-loop 也只能复用首次 baseline。
        4. 解析 baseline.failures[category] 为 sorted unique array；记录 timestamp + git rev-parse HEAD + invocation_hash。

        #### 步骤 B — Capture modified（每次改完代码立即重捕）

        1. 再跑 capture 脚本同一 stage/category 集合，写到 `reports/<task_id>-<tag>-modified-failures.json`。
        2. `new_regressions[category] = diff`，其中 `diff = sorted(modified.failures[category]) - sorted(baseline.failures[category])`。
        3. 若 `new_regressions` 任一 category 非空 → 立即修复 → 重 capture → 再 diff → 直到所有 new_regressions 为空。
        4. 写入 baseline_meta { baseline_path, modified_path, invocation_hash, new_regressions, modified_unchanged_count, modified_newly_fixed_count }。

        #### 步骤 C — Fail-Closed Rules（违反任一即 FAIL）

        - baseline.json 缺失 / 损坏 / parse fail → 节点 FAIL（视为未捕获 baseline）。
        - baseline.failures 与 modified.failures 的 invocation_hash 不一致 → 命令集合漂移 → 节点 FAIL。
        - modified 缺失 baseline 存在的 category key → 节点 FAIL（捕获不完整）。
        - capture exit 非零但 modified.failures 为空 → 节点 FAIL（无 stable failure ID）。
        - 跨 worktree 切换 / capture timeout → 节点 FAIL。

        > 节点专属执行步骤见 `Step 4.3.5: Baseline set-diff 验证`（在 Step 4.3 REFACTOR 之后、Step 4.4 跑全套测试 之前执行）。


        ### Step 4.0: 加载 skills（强制）

        - skill("test-driven-development") — TDD 铁律：先 RED 再 GREEN 再 REFACTOR

        - skill("verification-before-completion") — 完成前必须跑测试验证


        ### Step 4.1: RED（先写失败测试）

        - 在 worktree 内写至少 1 个失败测试（推荐 2-3 个，覆盖边界）

        - 跑测试确认失败 — 必须是功能缺失的失败，不是 typo 错

        - task_operation_create(action_type="progress", action_title="RED:
        failing test added")

        - task_update(progress=30)


        ### Step 4.2: GREEN（最小代码让测试通过）

        - 实现最小代码（不要 over-engineer）

        - 跑测试确认通过

        - task_operation_create(action_type="progress", action_title="GREEN:
        minimal fix implemented")

        - task_update(progress=50)


        ### Step 4.3: REFACTOR

        - 提取辅助函数 / 改进命名 / 移除死代码

        - 测试保持绿色（每次 refactor 后跑一次）

        - task_operation_create(action_type="milestone", action_title="REFACTOR
        complete")

        - task_update(progress=65)


        ### Step 4.3.5: Baseline set-diff 验证（v1.3 核心铁律）

        本节点专属执行步骤，对应 v1.3 baseline regression protocol 的 步骤 A → 步骤 B → 步骤 C：

        1. **步骤 A — Capture baseline**：在 Step 4.1 写任何代码**之前**（即 worktree 刚 setup 完、未做任何改动），运行：
           ```bash
           mkdir -p reports/
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage tdd \
             --category test,lint,typecheck \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-tdd-baseline.json
           ```
           - baseline.json 的 `invocation_hash` / `task_id` / `worktree_path` 不一致 → task_operation_create(problem) → 终止节点。
           - self-loop 重做时**禁止覆盖** baseline，仅复用首次生成的 reports/<task_id>-tdd-baseline.json。

        2. **步骤 B — Capture modified**：Step 4.1 RED / 4.2 GREEN / 4.3 REFACTOR 全部完成后，运行：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage tdd \
             --category test,lint,typecheck \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-tdd-modified-failures.json
           bun scripts/verify-rd-pipeline-baseline.ts \
             --baseline reports/<task_id>-tdd-baseline.json \
             --modified reports/<task_id>-tdd-modified-failures.json
           ```
           - `new_regressions[category] = diff`，diff = sorted(modified) - sorted(baseline)。非空 → 立即修复 → 重 capture → 再 diff → 直到空。

        3. **步骤 C — Fail-Closed Rules**：严格按上方协议段 `步骤 C` 校验；任一违反 → tdd_status = "FAIL"，触发 self-loop。

        4. 将 baseline_meta 写入 workflow_submit_output：{ baseline_path, modified_path, invocation_hash, new_regressions, modified_unchanged_count, modified_newly_fixed_count }。本步骤是 tdd-implement 节点 v1.3 的唯一入口。

        ### Step 5.2.5: Baseline regression 复审（v1.3 核心铁律）

        本节点专属执行步骤，对应 v1.3 baseline regression protocol 的 步骤 A → 步骤 B → 步骤 C：

        1. **步骤 A — Capture baseline（复用 tdd-implement）**：
           - 读取 `reports/<task_id>-tdd-baseline.json`；不存在 → task_operation_create(problem) → review_status="NEEDS_FIX"。
           - 校验 schema / task_id / worktree_path / invocation_hash；任一不一致 → FAIL。
           - 在 worktree 内用**同一 stage=review, category=test** 重新跑一次 capture 作为自检：
             ```bash
             bun scripts/capture-rd-pipeline-baseline.ts \
               --stage review \
               --category test \
               --task-id <init-task 节点返回的 task_id> \
               --out reports/<task_id>-review-baseline.json
             ```
             该自检必须与 tdd-implement 的 baseline 同 invocation_hash；否则命令集合漂移 → FAIL。

        2. **步骤 B — 跑 modified + set-diff**：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage review \
             --category test \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-review-modified-failures.json
           bun scripts/verify-rd-pipeline-baseline.ts \
             --baseline reports/<task_id>-review-baseline.json \
             --modified reports/<task_id>-review-modified-failures.json
           ```
           - `new_regressions[test] = sorted(modified.test) - sorted(baseline.test)`。
           - 若 new_regressions.test 非空 → 每个 ID 追加一行 `"regression: test:<id>"` 到 severity.blocking。

        3. **步骤 C — Fail-Closed Rules**：严格按上方协议段 `步骤 C` 校验；任一违反 → review_status="NEEDS_FIX"，触发 loop back 到 tdd-implement。

        4. `review_status="PASS"` 仅当 severity.blocking 为空 + new_regressions.test 为空 + 真实功能/API/测试/铁律无 BLOCKING 问题。**绝对零失败不是 PASS 条件**。

        ### ⚡ Bun test 提示（统一使用 --parallel=4）

        本项目 `bun test` **统一使用 `--parallel=4` 模式**：

        ```bash
        bun test <package_path> --parallel=4
        # 例：bun test packages/core --parallel=4
        # 例：bun test packages/cli --parallel=4
        # 例：bun test tests/cli --parallel=4
        ```

        **📌 v1.3 判定：运行 modified capture + set-diff，不做 checkout/stash，不重写 baseline**

        ```bash
        bun scripts/capture-rd-pipeline-baseline.ts --stage tdd --category test,lint,typecheck --task-id <task_id> --out reports/<task_id>-modified-failures.json
        bun scripts/verify-rd-pipeline-baseline.ts --baseline reports/<task_id>-baseline.json --modified reports/<task_id>-modified-failures.json
        ```

        test/lint/typecheck 当前计数只作 evidence；门禁只看新增稳定 ID 与 fail-closed reasons。`modified ⊆ baseline` 即无新增 regression，可 PASS。

        ### Step 4.4: 跑全套测试

        - 用 capture 脚本运行锁定的 test/lint/typecheck 命令；`{{input.test_command}}` 仅在与 baseline invocation 完全一致时可作为等价命令

        - 记录 new_regressions、fixed_pre_existing、unchanged；pre-existing failures/warnings 不算回归

        - task_operation_create(
            action_type="milestone",
            action_title="TDD cycle complete",
            action_description="新增 <N> 测试，<M> 通过，<K> pre-existing failures 已文档化"
          )

        ### Step 4.5: 输出（CRITICAL — 必须调用 workflow_submit_output）

        调用 `workflow_submit_output` 工具提交以下 JSON（**这是触发 loop 机制的关键**）：

        ```json

        {
          "tdd_status": "PASS" | "FAIL",
          "test_count_added": <n>,
          "test_count_passing": <n>,
          "pre_existing_failures": <n>,
          "baseline_meta": {
            "baseline_path": "reports/<task_id>-baseline.json",
            "modified_path": "reports/<task_id>-modified-failures.json",
            "invocation_hash": "<sha256>",
            "new_regressions": {"test": [], "lint": [], "typecheck": []},
            "modified_unchanged_count": <n>,
            "modified_newly_fixed_count": <n>
          },
          "files_modified": [<absolute paths>],
          "commits": [<commit hashes>]
        }

        ```

        - `tdd_status` 决定下游分支："PASS" → 进入 code-review；"FAIL" → 触发 self-loop 回环到
        tdd-implement 重做

        - **不要**用普通文本输出 — workflow engine 只会解析 workflow_submit_output 提交的 JSON


        ⚠️ 铁律：每个 commit 必须 atomic、独立可 revert、message 遵守 feat:/fix:/refactor: 前缀。
    depends_on:
      - plan
  - id: code-review
    type: agent
    name: "Phase 5: Code Review (BLOCKING/IMPORTANT/MINOR/NIT 分级)"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
          description: Code review 结果 — review_status 决定下游分支（PASS→cli-e2e-test /
            NEEDS_FIX→tdd-implement 修复）
          properties:
            review_status:
              type: string
              description: '"PASS" 表示无功能/安全 BLOCKING 且 test/lint/typecheck 无 baseline 外新增 regression；pre-existing failures 不阻断；"NEEDS_FIX" 表示真实 blocking、新 regression 或 fail-closed reason'
            severity:
              type: object
              properties:
                blocking:
                  type: array
                  items:
                    type: string
                important:
                  type: array
                  items:
                    type: string
                minor:
                  type: array
                  items:
                    type: string
                nit:
                  type: array
                  items:
                    type: string
            test_coverage:
              type: string
            api_design:
              type: string
            recommendation:
              type: string
            commits_reviewed:
              type: array
              items:
                type: string
            baseline_meta:
              type: object
              description: v1.3 immutable baseline 与 modified set-diff 元数据
              properties:
                baseline_path:
                  type: string
                modified_path:
                  type: string
                invocation_hash:
                  type: string
            new_regressions:
              type: object
              description: test/lint/typecheck 各类 baseline 外新增稳定 failure/warning ID
          required:
            - review_status
            - severity
            - commits_reviewed
      prompt: >
        ## Phase 5: Code Review


        工作目录: {{input.project_path}}/.worktrees/{{input.branch_name}}

        任务 ID: <init-task 节点返回的 task_id>

        ### ⚡ Baseline regression testing protocol（v1.3 铁律）

        本节点不得从 feature 结果重建 baseline。读取 tdd-implement 在改生产代码前生成并 commit 的 immutable `reports/<task_id>-baseline.json`，然后运行同一 test/lint/typecheck 命令集合写 `reports/<task_id>-modified-failures.json`：

        ```bash
        bun scripts/capture-rd-pipeline-baseline.ts --stage tdd --category test,lint,typecheck --task-id <task_id> --out reports/<task_id>-modified-failures.json
        bun scripts/verify-rd-pipeline-baseline.ts --baseline reports/<task_id>-baseline.json --modified reports/<task_id>-modified-failures.json
        ```

        - `new_regressions[k] = sorted(unique(modified.failures[k])) - sorted(unique(baseline.failures[k]))`；所有 key 为空，即 `modified ⊆ baseline`，哪怕有 pre-existing 非零 exit / warning 也通过 validation regression gate。
        - baseline 只可复用不可覆盖；schema/task_id/worktree/invocation_hash 不一致、命令集合漂移、JSON 缺失/损坏、timeout、非零退出无法解析稳定 ID 均 fail-closed。
        - 稳定 ID 为 `<category>:<file>:<symbol>:<line|errorCode>`，sorted + unique。每个新增 ID 追加到 `severity.blocking`：`regression:<category>:<id>`。
        - validation baseline 豁免不影响功能正确性、安全性、API 破坏、数据丢失等 BLOCKING 判断。
        - `review_status="PASS"` 仅当 blocking 为空且 test/lint/typecheck `new_regressions` 全空；important/minor/nit 仍按既有规则记录。
        - task_operation_create(milestone) 必须附 baseline/modified 路径、invocation_hash 与 diff 摘要。

        对比基准: {{input.base_branch}}...HEAD


        ### ⚡ Baseline regression testing protocol（v1.3 铁律）

        本节点使用 baseline set-diff 评估 test/lint/typecheck/build/CLI smoke：
        - **绝对零失败不是 PASS 条件**；pre-existing failures 不算 regression。
        - 只看"是否引入 baseline 没有的新稳定失败"。
        - 支持的 category（5 类）：`"test"` / `"lint"` / `"typecheck"` / `"build"` / `"cli-smoke"`。
        - 真实功能/安全/代码审查 BLOCKING 问题仍照常阻断；本协议只豁免 pre-existing 测试/lint/类型/build/smoke 噪声。

        #### 步骤 A — Capture baseline（code-review 节点**复用** tdd-implement 节点已捕获的 baseline）

        1. 读取 `reports/<task_id>-tdd-baseline.json`（tdd-implement 节点必须已写入；否则本节点 FAIL）。
        2. 校验 schema / task_id / worktree_path / invocation_hash；不一致 → task_operation_create(problem) → FAIL。
        3. 在 worktree 内再次运行 capture 脚本作为**自检**：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage review \
             --category test \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-review-baseline.json
           ```
           - 写入的 baseline.json 与 tdd-implement 的 invocation_hash 必须一致；否则命令漂移 → FAIL。

        #### 步骤 B — Capture modified（跑 review 自检对应的 modified）

        1. 跑 capture 同一 stage/category，写到 `reports/<task_id>-review-modified-failures.json`：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage review \
             --category test \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-review-modified-failures.json
           bun scripts/verify-rd-pipeline-baseline.ts \
             --baseline reports/<task_id>-review-baseline.json \
             --modified reports/<task_id>-review-modified-failures.json
           ```
        2. `new_regressions[category] = diff`，diff = sorted(modified) - sorted(baseline)。

        #### 步骤 C — Fail-Closed Rules（违反任一即 FAIL）

        - baseline.json 缺失 / 损坏 / parse fail → 节点 FAIL（视为未捕获 baseline）。
        - invocation_hash 不一致 → 命令集合漂移 → 节点 FAIL。
        - capture exit 非零但 modified.failures 为空 → 节点 FAIL。
        - 跨 worktree 切换 / capture timeout → 节点 FAIL。

        > 节点专属执行步骤见 `Step 5.2.5: Baseline regression 复审`（在 Step 5.2 审查维度 之后、Step 5.3 分级输出 之前执行）。

        ### Step 5.0: 加载 skills（强制）

        - skill("requesting-code-review") — review checklist + 输出格式


        ### Step 5.1: 收集 diff

        - `git diff {{input.base_branch}}...HEAD --stat` — 文件级改动统计

        - `git diff {{input.base_branch}}...HEAD` — 实际代码改动

        - `git log {{input.base_branch}}..HEAD --oneline` — commit 列表


        ### Step 5.2: 审查维度

        - **功能正确性**：是否满足 plan 文档中的所有验收标准？

        - **测试覆盖**：是否有 RED 测试 / 边界用例 / 反向断言？

        - **API 设计**：命名清晰 / 参数合理 / 向后兼容？

        - **代码质量**：类型安全 / 错误处理 / 无死代码 / 无遗留 TODO？

        - **文档同步**：plan 文档 / README / JSDoc 是否同步更新？

        - **铁律检查**：未直接 commit 到 main / 未破坏既有测试 / commit message 合规？


        ### ⚡ Bun test 提示（统一使用 --parallel=4）

        本项目 `bun test` **统一使用 `--parallel=4` 模式**：

        ```bash
        bun test <package_path> --parallel=4
        # 例：bun test packages/core --parallel=4
        # 例：bun test packages/cli --parallel=4
        # 例：bun test tests/cli --parallel=4
        ```

        **📌 v1.3 判定：只复用 immutable baseline，运行 modified capture + set-diff**

        禁止 checkout/stash 或在 review 阶段覆盖 baseline。测试通过数、lint warning 总数、type error 总数只作 evidence；仅 baseline 外新增稳定 ID 是 validation regression。

        ### Step 5.3: 分级输出（CRITICAL — 必须调用 workflow_submit_output）

        调用 `workflow_submit_output` 工具提交以下 JSON（**这是触发 loop 机制的关键**）：

        ```json

        {
          "review_status": "PASS" | "NEEDS_FIX",
          "severity": {
            "blocking": [<必须立即修，否则阻断 merge 的问题>],
            "important": [<应该修，但可以后续 PR>],
            "minor": [<建议改进，不影响功能>],
            "nit": [<纯风格 nit>]
          },
          "test_coverage": "<评估>",
          "api_design": "<评估>",
          "recommendation": "<改进建议或放行声明>",
          "commits_reviewed": [<commit hashes>]
        }

        ```

        - `review_status` 决定下游分支："PASS" → 进入 cli-e2e-test；"NEEDS_FIX" → 回环到
        tdd-implement 重做

        - **不要**用普通文本输出 — workflow engine 只会解析 workflow_submit_output 提交的 JSON


        ### Step 5.4: 记录

        - task_operation_create(
            action_type="review",
            action_title="Code review: <status>",
            action_description=<完整 JSON>
          )
        - task_update(progress=75)


        ### 关键规则

        - 如果 blocking 数组非空 → review_status = "NEEDS_FIX"，下游 final-verify
        节点会判定为失败并触发 loop back 到 tdd-implement

        - 如果仅 important 数组非空 → review_status = "PASS"，但应在 summary 报告里记录为
        follow-up

        - 否则 → review_status = "PASS"
    depends_on:
      - tdd-implement
  - id: cli-e2e-test
    type: agent
    name: "Phase 6: CLI E2E (build + unit tests + CLI smoke)"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
