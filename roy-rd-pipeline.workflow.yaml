          required:
            - cli_e2e_status
            - build_ok
            - test_ok
            - cli_smoke_ok
      prompt: >
        ## Phase 6: CLI E2E（命令行级端到端验证）


        工作目录: {{input.project_path}}/.worktrees/{{input.branch_name}}

        任务 ID: <init-task 节点返回的 task_id>


        ### ⚡ Baseline regression testing protocol（v1.3 铁律）

        本节点使用 baseline set-diff 评估 test/lint/typecheck/build/CLI smoke：
        - **绝对零失败不是 PASS 条件**；pre-existing failures 不算 regression。
        - 只看"是否引入 baseline 没有的新稳定失败"。
        - 支持的 category（5 类）：`"test"` / `"lint"` / `"typecheck"` / `"build"` / `"cli-smoke"`。
        - 真实功能/安全/代码审查 BLOCKING 问题仍照常阻断；本协议只豁免 pre-existing 测试/lint/类型/build/smoke 噪声。
        - 本节点**分三段**（build / test / cli-smoke）各捕获 baseline + modified，节点专属步骤见 Step 6.1.b1 / 6.1.t1 / 6.1.c1 / 6.1.m1。

        #### 步骤 A — Capture baseline（cli-e2e-test 节点在 build 之前先捕 3 段 baseline）

        1. `mkdir -p reports/`
        2. 跑三段 capture，分别写到独立 JSON：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage e2e --category build \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-e2e-build-baseline.json
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage e2e --category test \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-e2e-test-baseline.json
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage e2e --category cli-smoke \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-e2e-cli-smoke-baseline.json
           ```
        3. 若 baseline.json 已存在 / schema 损坏 / task_id / worktree_path / invocation_hash 不一致 → task_operation_create(action_type="problem") → 终止本节点。
        4. 解析各 baseline.failures[category] 为 sorted unique array。

        #### 步骤 B — Capture modified（每段实际跑完 build/test/cli-smoke 后立即重捕）

        1. 同样三段 capture，写到 modified JSON：
           - `reports/<task_id>-e2e-build-modified-failures.json`
           - `reports/<task_id>-e2e-test-modified-failures.json`
           - `reports/<task_id>-e2e-cli-smoke-modified-failures.json`
        2. `new_regressions[category] = diff`，diff = sorted(modified.failures) - sorted(baseline.failures)，三段各自算。
        3. 三段任一非空 → cli_e2e_status = "FAIL"，fail_reason 填 `"regression:<category>:<first ID>"`。

        #### 步骤 C — Fail-Closed Rules（违反任一即 FAIL）

        - baseline.json 缺失 / 损坏 / parse fail → 节点 FAIL（视为未捕获 baseline）。
        - 三段 baseline 与对应 modified 的 invocation_hash 不一致 → 命令集合漂移 → 节点 FAIL。
        - modified 缺失 baseline 存在的 category key → 节点 FAIL（捕获不完整）。
        - capture exit 非零但 modified.failures 为空 → 节点 FAIL（无 stable failure ID）。
        - 跨 worktree 切换 / capture timeout → 节点 FAIL。

        > 节点专属执行步骤见 `Step 6.1.b1 / 6.1.t1 / 6.1.c1 / 6.1.m1`（在 Step 6.1 三阶段 之中穿插执行）。

        ### Step 6.0: 加载 skills（强制）

        - skill("verification-before-completion") — 完成前必须独立跑所有验收命令


        ### Step 6.1.b1: Build baseline + modified capture（v1.3）

        1. **步骤 A — Capture baseline**（在跑 `{{input.build_command}}` 之前）：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage e2e --category build \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-e2e-build-baseline.json
           ```
        2. 跑 `{{input.build_command}}`，记录 exit code + 日志到 `/tmp/rd_pipeline_build.log`。
        3. **步骤 B — Capture modified**（build 跑完后立即）：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage e2e --category build \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-e2e-build-modified-failures.json
           bun scripts/verify-rd-pipeline-baseline.ts \
             --baseline reports/<task_id>-e2e-build-baseline.json \
             --modified reports/<task_id>-e2e-build-modified-failures.json
           ```
        4. `new_regressions[build] = sorted(modified.build) - sorted(baseline.build)`。非空 → `cli_e2e_status="FAIL"`，`fail_reason="regression:build:<first ID>"`，跳过后续阶段。
        5. **步骤 C — Fail-Closed Rules**：见上方协议段；baseline 缺失 / 命令漂移 / capture timeout → 立即 FAIL。

        ### Step 6.1.t1: Test baseline + modified capture（v1.3）

        1. **步骤 A — Capture baseline**（在跑 `{{input.test_command}}` 之前，仅当 build OK 时执行）：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage e2e --category test \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-e2e-test-baseline.json
           ```
        2. 跑 `{{input.test_command}}`，记录 exit code + pass/fail 数 + 日志到 `/tmp/rd_pipeline_test.log`。
        3. **步骤 B — Capture modified**：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage e2e --category test \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-e2e-test-modified-failures.json
           bun scripts/verify-rd-pipeline-baseline.ts \
             --baseline reports/<task_id>-e2e-test-baseline.json \
             --modified reports/<task_id>-e2e-test-modified-failures.json
           ```
        4. `new_regressions[test] = sorted(modified.test) - sorted(baseline.test)`。非空 → `cli_e2e_status="FAIL"`，`fail_reason="regression:test:<first ID>"`，跳过后续阶段。
        5. **步骤 C — Fail-Closed Rules**：同上。

        ### Step 6.1.c1: CLI smoke baseline + modified capture（v1.3）

        1. **步骤 A — Capture baseline**（在跑 `{{input.cli_smoke_command}}` 之前，仅当 build + test 都 OK 时执行）：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage e2e --category cli-smoke \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-e2e-cli-smoke-baseline.json
           ```
        2. 跑 `{{input.cli_smoke_command}}`，记录 exit code + 日志到 `/tmp/rd_pipeline_cli.log`。
        3. **步骤 B — Capture modified**：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage e2e --category cli-smoke \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-e2e-cli-smoke-modified-failures.json
           bun scripts/verify-rd-pipeline-baseline.ts \
             --baseline reports/<task_id>-e2e-cli-smoke-baseline.json \
             --modified reports/<task_id>-e2e-cli-smoke-modified-failures.json
           ```
        4. `new_regressions[cli-smoke] = sorted(modified.cli-smoke) - sorted(baseline.cli-smoke)`。非空 → `cli_e2e_status="FAIL"`，`fail_reason="regression:cli-smoke:<first ID>"`。
        5. **步骤 C — Fail-Closed Rules**：同上。

        ### Step 6.1.m1: 三段 aggregate diff（v1.3 收尾）

        1. 汇总 new_regressions 字典：`{ build: [...], test: [...], cli-smoke: [...] }`。
        2. 任一 category 非空 → `cli_e2e_status="FAIL"`，输出 new_regressions 到 fail_reason。
        3. 全部空 → `cli_e2e_status="PASS"`，cli_e2e 节点视为通过，可进入 final-verify。
        4. 写 task_operation_create(action_type="milestone", action_description=<new_regressions 字典 + 各 capture 路径>)。

        ### Step 6.1: 执行三个阶段（按顺序，前一阶段失败则跳过后续）

        - **阶段 1: BUILD** — 在 worktree 内调用 bash 工具运行 `{{input.build_command}}`，
          记录 exit code（保存日志到 /tmp/rd_pipeline_build.log，末尾 10 行嵌入 evidence）

        - **阶段 2: UNIT TESTS** — 仅当 build 成功时执行，运行 `{{input.test_command}}`，
          记录 exit code 与 pass/fail 数（保存日志到 /tmp/rd_pipeline_test.log，末尾 20 行嵌入 evidence）

        - **阶段 3: CLI SMOKE** — 仅当 build + tests 都成功时执行，运行 `{{input.cli_smoke_command}}`，
          记录 exit code（保存日志到 /tmp/rd_pipeline_cli.log，末尾 10 行嵌入 evidence）

        - ⚠️ 任一阶段失败：立即停止后续阶段，cli_e2e_status 设为 FAIL，
          fail_reason 填该阶段名称（如 "build failed" / "test failed" / "cli smoke failed"）

        - 全部阶段成功：cli_e2e_status = "PASS"

        ### Step 6.2: 输出（CRITICAL — 必须调用 workflow_submit_output）

        调用 `workflow_submit_output` 工具提交以下 JSON（**这是触发 loop 机制的关键**）：

        ```json

        {
          "cli_e2e_status": "PASS" | "FAIL",
          "build_ok": <boolean>,
          "build_exit_code": <integer>,
          "test_ok": <boolean>,
          "test_exit_code": <integer>,
          "test_count_passed": <integer>,
          "test_count_failed": <integer>,
          "cli_smoke_ok": <boolean>,
          "cli_smoke_exit_code": <integer>,
          "fail_reason": "<build failed | test failed | cli smoke failed | 空字符串>",
          "build_log_tail": "<last 10 lines of build log>",
          "test_log_tail": "<last 20 lines of test log>",
          "cli_log_tail": "<last 10 lines of cli smoke log>"
        }

        ```

        - `cli_e2e_status` 决定下游分支："PASS" → 进入 final-verify；"FAIL" → 回环到 tdd-implement 重做

        - **不要**用普通文本输出 — workflow engine 只会解析 workflow_submit_output 提交的 JSON


        ### Step 6.3: 记录

        - task_operation_create(
            action_type="milestone",
            action_title="CLI E2E: <status>",
            action_description=<完整 JSON + 三个阶段日志摘要>
          )
        - task_update(progress=85)
    depends_on:
      - code-review
  - id: final-verify
    type: agent
    name: "Phase 7: 最终验证 (8 项 checklist + verification-before-completion)"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
          description: Final verify 结果 — verify_status 决定下游分支（PASS→merge-to-main /
            FAIL→tdd-implement 修复）
          properties:
            verify_status:
              type: string
              description: '"PASS" 表示 8 项 checklist 全部通过；"FAIL" 表示任一失败，触发回环到 tdd-implement'
            checklist:
              type: object
              description: 8 项 checklist 逐项布尔结果
              properties:
                goals_verified:
                  type: boolean
                plan_doc_verified:
                  type: boolean
                evidence_collected:
                  type: boolean
                no_obvious_issues:
                  type: boolean
                review_passed:
                  type: boolean
                build_passes:
                  type: boolean
                tests_pass:
                  type: boolean
                cli_smoke_passes:
                  type: boolean
            failed_items:
              type: array
              items:
                type: string
            evidence:
              type: object
              properties:
                build_exit_code:
                  type: integer
                test_exit_code:
                  type: integer
                cli_smoke_exit_code:
                  type: integer
          required:
            - verify_status
            - checklist
            - failed_items
      prompt: >
        ## Phase 7: 最终验证


        工作目录: {{input.project_path}}/.worktrees/{{input.branch_name}}

        任务 ID: <init-task 节点返回的 task_id>


        ### ⚡ Baseline regression testing protocol（v1.3 铁律）

        本节点使用 baseline set-diff 评估 test/lint/typecheck/build/CLI smoke：
        - **绝对零失败不是 PASS 条件**；pre-existing failures 不算 regression。
        - 只看"是否引入 baseline 没有的新稳定失败"。
        - 支持的 category（5 类）：`"test"` / `"lint"` / `"typecheck"` / `"build"` / `"cli-smoke"`。
        - 真实功能/安全/代码审查 BLOCKING 问题仍照常阻断；本协议只豁免 pre-existing 测试/lint/类型/build/smoke 噪声。
        - 本节点**独立运行** modified 重检（不复用 tdd-implement / cli-e2e-test 的结果）以验证前节点结论可信。

        #### 步骤 A — Capture baseline（复用前节点已捕获的 baseline）

        1. 读取 `reports/<task_id>-tdd-baseline.json`（来自 tdd-implement）+ `reports/<task_id>-e2e-{build,test,cli-smoke}-baseline.json`（来自 cli-e2e-test）。
        2. 任一缺失 → task_operation_create(action_type="problem") → FAIL。
        3. 校验 schema / task_id / worktree_path / invocation_hash；任一不一致 → FAIL。

        #### 步骤 B — Capture modified（独立重检 modified；不信 tdd-implement 报告）

        1. 跑 capture 脚本（stage=verify + 全部 5 category）独立捕获：
           ```bash
           mkdir -p reports/
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage verify \
             --category test,build,cli-smoke \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-verify-modified-failures.json
           bun scripts/verify-rd-pipeline-baseline.ts \
             --baseline reports/<task_id>-tdd-baseline.json \
             --modified reports/<task_id>-verify-modified-failures.json
           ```
        2. `new_regressions[category] = diff`，diff = sorted(modified) - sorted(baseline)，三 category 各自算。
        3. 任一非空 → 8 项 checklist 的 `tests_pass / build_passes / cli_smoke_passes` 标记为 false。

        #### 步骤 C — Fail-Closed Rules（违反任一即 FAIL）

        - baseline.json 缺失 / 损坏 / parse fail → 节点 FAIL（视为未捕获 baseline）。
        - baseline 与 modified 的 invocation_hash 不一致 → 命令集合漂移 → 节点 FAIL。
        - modified 缺失 baseline 存在的 category key → 节点 FAIL（捕获不完整）。
        - capture exit 非零但 modified.failures 为空 → 节点 FAIL（无 stable failure ID）。
        - 跨 worktree 切换 / capture timeout → 节点 FAIL。

        > 节点专属执行步骤见 `Step 7.3.5: 独立 baseline/modified 重检`（在 Step 7.3 独立验证 之后、Step 7.4 判定 之前执行）。

        ### Step 7.0: 加载 skills（强制）

        - skill("verification-before-completion") — 完成前必须独立运行所有验收命令


        ### Step 7.1: 读取所有 task operations

        - task_operation_list(task_id=<task_id>, limit=50)

        - 检查每个验收标准都有对应 progress/milestone/review 记录


        ### Step 7.2: 8 项 checklist（必须逐项核查）

        - [ ] **goals-verified** — 任务 goals 全部满足（对照 init-task description）

        - [ ] **plan-doc-verified** — plan 文档每个文件清单都已实现

        - [ ] **evidence-collected** — 有 build/test/review 实际输出作为证据

        - [ ] **no-obvious-issues** — 无 missing imports / 语法错误 / type error

        - [ ] **review-passed** — code-review 节点输出 review_status === "PASS" 且
        blocking 数组为空

        - [ ] **build-passes** — {{input.build_command}} exit 0

        - [ ] **tests-pass** — {{input.test_command}} 全部通过（pre-existing failures
        已在 tdd-implement 节点文档化）

        - [ ] **cli-smoke-passes** — CLI 命令可执行且输出预期


        ### ⚡ Bun test 提示（统一使用 --parallel=4）

        本项目 `bun test` **统一使用 `--parallel=4` 模式**：

        ```bash
        bun test <package_path> --parallel=4
        # 例：bun test packages/core --parallel=4
        # 例：bun test packages/cli --parallel=4
        # 例：bun test tests/cli --parallel=4
        ```

        **📌 关键约束：必须先跑 baseline，再跑修改后**

        1. **跑 baseline（main 分支基线）**：
           - checkout 到 main 或 `git stash` 暂存所有修改
           - 跑 `bun test <package_path> --parallel=4`
           - 记录 baseline 失败列表（fail_test_names）和通过数

        2. **跑修改后测试**：
           - 恢复你的修改（或重新跑）
           - 跑 `bun test <package_path> --parallel=4`
           - 记录修改后失败列表和通过数

        3. **对比判定**：
           - ✅ PASS：修改后失败列表 == baseline 失败列表（甚至更少）
           - ❌ FAIL：修改后引入了 baseline 没有的新失败

        **重要原则**：
        - 只看"是否引入新错误"，不要被 baseline 已有的失败误导
        - baseline 已存在的失败是已知的，不算 regression
        - 如果不确定，先跑一次 baseline 确认 pre-existing 失败列表

        ### Step 7.3: 独立验证（不信任 tdd-implement 报告）

        - 在 worktree 内重新跑一次 {{input.test_command}}，确认本节点独立验证通过

        - 跑一次 {{input.build_command}}，确认产物可用

        - 跑一次 {{input.cli_smoke_command}}，确认 CLI 可启动


        ### Step 7.3.5: 独立 baseline/modified 重检（v1.3 核心铁律）

        本节点专属执行步骤，对应 v1.3 baseline regression protocol 的 步骤 A → 步骤 B → 步骤 C：

        1. **步骤 A — Capture baseline（复用 tdd-implement / cli-e2e-test 已捕获的 baseline）**：
           - 读取 `reports/<task_id>-tdd-baseline.json` + `reports/<task_id>-e2e-{build,test,cli-smoke}-baseline.json`。
           - 任一缺失 → task_operation_create(action_type="problem") → verify_status="FAIL"。
           - 校验 schema / task_id / worktree_path / invocation_hash；任一不一致 → FAIL。

        2. **步骤 B — Capture modified（独立重检 modified）**：
           ```bash
           bun scripts/capture-rd-pipeline-baseline.ts \
             --stage verify \
             --category test,build,cli-smoke \
             --task-id <init-task 节点返回的 task_id> \
             --out reports/<task_id>-verify-modified-failures.json
           bun scripts/verify-rd-pipeline-baseline.ts \
             --baseline reports/<task_id>-tdd-baseline.json \
             --modified reports/<task_id>-verify-modified-failures.json
           ```
           - `new_regressions[category] = diff`，diff = sorted(modified) - sorted(baseline)，三 category 各自算。
           - 任一非空 → 8 项 checklist 的 `tests_pass / build_passes / cli_smoke_passes` 标记为 false，并 append 到 failed_items。

        3. **步骤 C — Fail-Closed Rules**：严格按上方协议段 `步骤 C` 校验；任一违反 → verify_status="FAIL"，触发 loop back 到 tdd-implement。

        4. `verify_status="PASS"` 仅当 8 项 checklist 全过 + new_regressions 字典全空（test / build / cli-smoke 三个 array 均为 []）。**绝对零失败不是 PASS 条件**；pre-existing failures 可保留。

        ### Step 7.4: 判定

        - 全部 8 项通过 → verify_status = "PASS"，进入 merge-to-main

        - 任一失败 → verify_status = "FAIL"，触发 loop back 到 tdd-implement 节点

        - 同时记录失败原因到 task_operation（action_type=problem）


        ### Step 7.5: 记录

        - task_operation_create(
            action_type="review",
            action_title="Final verify: <status>",
            action_description=<8 项 checklist JSON + 失败原因（如果有）>
          )
        - task_update(progress=85)


        ### Step 7.6: 输出（CRITICAL — 必须调用 workflow_submit_output）

        调用 `workflow_submit_output` 工具提交以下 JSON（**这是触发 loop 机制的关键**）：

        ```json

        {
          "verify_status": "PASS" | "FAIL",
          "checklist": {
            "goals_verified": true/false,
            "plan_doc_verified": true/false,
            "evidence_collected": true/false,
            "no_obvious_issues": true/false,
            "review_passed": true/false,
            "build_passes": true/false,
            "tests_pass": true/false,
            "cli_smoke_passes": true/false
          },
          "failed_items": [<name of failed checklist item>],
          "evidence": {
            "build_exit_code": <n>,
            "test_exit_code": <n>,
            "cli_smoke_exit_code": <n>
          }
        }

        ```

        - `verify_status` 决定下游分支："PASS" → 进入 merge-to-main；"FAIL" → 回环到
        tdd-implement 重做

        - **不要**用普通文本输出 — workflow engine 只会解析 workflow_submit_output 提交的 JSON
    depends_on:
      - cli-e2e-test
  - id: merge-to-main
    type: agent
    name: "Phase 8: Merge to local main (auto_merge 铁律 + 冲突预检 + 验证)"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
          description: Merge 结果 — merge_status 决定 summary-report 内容（merge_status 取值 MERGED | MERGE_SKIPPED | MERGE_FAILED）
          properties:
            merge_status:
              type: string
              description: '"MERGED" 表示成功合并到 base_branch；"MERGE_SKIPPED" 表示 auto_merge=false
                跳过；"MERGE_FAILED" 表示执行失败（冲突/构建失败/用户撤销）'
            merge_reason:
              type: string
              description: merge 状态原因（SKIPPED 时是授权提示，FAILED 时是失败原因）
            merge_commit:
              type: string
              description: merge commit hash（仅 MERGED 时有值）
            base_branch:
              type: string
            feature_branch:
              type: string
            post_merge_build_ok:
              type: boolean
              description: MERGED 时 post-merge build 是否成功
            post_merge_test_ok:
              type: boolean
              description: MERGED 时 post-merge tests 是否成功
            worktree_path:
              type: string
              description: 保留的 worktree 路径（用户最终验收后可清理）
          required:
            - merge_status
            - merge_reason
            - base_branch
            - feature_branch
      prompt: >
        ## Phase 8: Merge to local main（auto_merge 铁律 + 冲突预检 + 验证）


        工作目录: {{input.project_path}}（主 worktree，**不是** feature worktree）

        任务 ID: <init-task 节点返回的 task_id>

        基础分支: {{input.base_branch}}

        特性分支: {{input.task_type}}/{{input.branch_name}}

        auto_merge: {{input.auto_merge}}

        worktree 路径: {{input.project_path}}/.worktrees/{{input.branch_name}}


        ### ⚠️ 铁律

        1. **auto_merge 必须显式为 "true" 才执行** — 默认 "false" → MERGE_SKIPPED
        2. **必须在主 worktree 内执行**，不能在 feature worktree 内执行
        3. **冲突时自动 rebase 到最新 base_branch**（保留 main 已有逻辑优先）
        4. **merge 后必须跑 build + tests 验证 main 未被破坏**，否则回滚
        5. **worktree 保留**（不清理），等用户最终验收


        ### Step 8.1: 判断是否执行 merge

        - 调用 bash 工具检查 `{{input.auto_merge}}`：
          - **不等于 "true"** → merge_status = "MERGE_SKIPPED"，
            merge_reason = "auto_merge='{{input.auto_merge}}' (需要用户显式授权为 'true')"
            → 跳到 Step 8.6 直接输出
          - **等于 "true"** → 继续执行以下步骤


        ### Step 8.2: 工作目录校验

        - 用 bash 工具运行 `git rev-parse --show-toplevel`，确认不在 feature worktree 内

        - 如果在 feature worktree 内 → merge_status = "MERGE_FAILED"，merge_reason = "WORKTREE_ERROR"
          → 跳到 Step 8.6


        ### Step 8.3: Checkout base_branch + 拉取最新

        - `git checkout {{input.base_branch}}`

        - `git pull --ff-only`（如果离线则跳过）


        ### Step 8.4: 冲突预检（git merge-tree）

        - `MERGE_BASE=$(git merge-base {{input.base_branch}} {{input.task_type}}/{{input.branch_name}})`

        - `git merge-tree $MERGE_BASE {{input.base_branch}} {{input.task_type}}/{{input.branch_name}} | grep "<<<<<<<"`
          判断是否有冲突

        - **有冲突** → 自动 rebase：
          1. `git checkout {{input.task_type}}/{{input.branch_name}}`
          2. `git rebase {{input.base_branch}}`
          3. rebase 失败 → `git rebase --abort` + merge_status = "MERGE_FAILED"，merge_reason = "REBASE_FAILED"
          4. rebase 成功 → `git checkout {{input.base_branch}}` 后继续

        - **无冲突** → 直接进入 Step 8.5


        ### Step 8.5: 执行 merge + post-merge 验证

        - `git merge --no-ff {{input.task_type}}/{{input.branch_name}} -m "Merge {{input.task_type}}/{{input.branch_name}} into {{input.base_branch}}"`

        - 跑 `{{input.build_command}}`，exit != 0 → merge_status = "MERGE_FAILED"，merge_reason = "POST_MERGE_BUILD_FAILED"

        - 跑 `{{input.test_command}}`，exit != 0 → merge_status = "MERGE_FAILED"，merge_reason = "POST_MERGE_TEST_FAILED"

        - 全部成功 → merge_status = "MERGED"，merge_commit = `git rev-parse HEAD`


        ### Step 8.6: 输出（CRITICAL — 必须调用 workflow_submit_output）

        调用 `workflow_submit_output` 工具提交以下 JSON（**这是 summary-report 节点读取状态的关键**）：

        ```json

        {
          "merge_status": "MERGED" | "MERGE_SKIPPED" | "MERGE_FAILED",
          "merge_reason": "<reason>",
          "merge_commit": "<commit hash | 空字符串>",
          "base_branch": "{{input.base_branch}}",
          "feature_branch": "{{input.task_type}}/{{input.branch_name}}",
          "post_merge_build_ok": <boolean>,
          "post_merge_test_ok": <boolean>,
          "worktree_path": "{{input.project_path}}/.worktrees/{{input.branch_name}}"
        }

        ```

        - **不要**用普通文本输出 — workflow engine 只会解析 workflow_submit_output 提交的 JSON


        ### Step 8.7: 记录

        - task_operation_create(
            action_type="milestone",
            action_title="Merge: <merge_status>",
            action_description=<完整 JSON + merge_commit / fail 原因>
          )
        - task_update(progress=95)
    depends_on:
      - final-verify
  - id: summary-report
    type: agent
    name: "Phase 9: 构建总结报告 + 任务闭环"
    config:
      agent_type: roy
      output:
        mode: json
        schema:
          type: object
          description: 总结报告结果 — workflow 终态
          properties:
            summary_report_path:
              type: string
            task_completed:
              type: boolean
            task_progress:
              type: integer
            merge_status:
              type: string
              description: '"MERGED" / "READY_FOR_MERGE" / "FAILED" — 给外部系统读'
            next_step:
              type: string
          required:
            - summary_report_path
            - task_completed
            - merge_status
            - next_step
      prompt: >
        ## Phase 9: 构建总结报告 + 任务闭环


        任务 ID: <init-task 节点返回的 task_id>

        报告输出: {{input.report_dir}}<task_id>-rd-summary.md


        ### Step 9.1: 收集所有阶段产物

        - 读取 task_operation_list(task_id=<task_id>, limit=50) 获取完整执行轨迹

        - 读取 plan 节点产出的 plan_doc 路径

        - 读取 tdd-implement 节点的 files_modified / commits / test_count

        - 读取 code-review 节点的 review JSON（severity 分布）

        - 读取 final-verify 节点的 checklist 结果

        - 读取 merge-to-main 节点的 stdout（MERGE_OK 或 MERGE_SKIPPED）


        ### Step 9.2: 生成 markdown 报告


        在 worktree 内执行 `mkdir -p {{input.report_dir}}`，然后写入
        `<task_id>-rd-summary.md`。


        报告必须包含以下小节（agent 根据阶段产物填充实际内容）：


        - `## 任务概览`：标题 / 类型 / 优先级 / 分支 / 基础分支 / Worktree / 任务链接

        - `## 执行轨迹（9 个阶段）`：每个阶段一段，包含该阶段的 op 记录与状态
            - Phase 1: 任务管理（相似任务参考、Tags）
            - Phase 2: Worktree 隔离（路径 / 分支 / 状态）
            - Phase 3: Plan（设计文档路径 / 预计涉及文件 / 预计测试数）
            - Phase 4: TDD 循环（RED/GREEN/REFACTOR / 测试结果 / Commits）
            - Phase 5: Code Review（status / severity 分布 / 建议）
            - Phase 6: CLI E2E（Build / Tests / CLI Smoke 三个 PASS/FAIL）
            - Phase 7: 最终验证（status / 8 项 checklist 逐项打勾或叉）
            - Phase 8: Merge 状态 — 根据 auto_merge 实际值选择：
                - 如果 auto_merge 是 "true" 且 merge-to-main 节点输出包含 "MERGE_OK"：
                  写 "已合并到 {{input.base_branch}} (commit: <hash>)" 并附带 post-merge build/tests 结果
                - 否则：写 "未合并（auto_merge={{input.auto_merge}}，需用户授权），分支已就绪: {{input.task_type}}/{{input.branch_name}}"
            - Phase 9: 总结报告（报告路径 / 任务状态）
        - `## 改动文件清单`：执行 `git diff {{input.base_branch}}...HEAD --stat` 抓取输出嵌入

        - `## 关键代码片段`：1-2 个最重要的改动（附 commit hash）

        - `## 遗留事项 / 风险`：未解决的问题 / 已知限制 / pre-existing failures 列表

        - `## 下一步建议`：例如用户审查 worktree 后可合并到 main / 建议拆分多个 PR / 建议补充集成测试


        报告必须以一级标题 `# R&D Task #<task_id> Summary Report` 开头，并标注 "Generated by
        roy-rd-pipeline v1.2"。


        ### Step 9.3: 任务闭环

        - task_operation_create(
            action_type="completed",
            action_title="R&D pipeline complete",
            action_description="Summary report: <report_path>"
          )
        - task_update(progress=100)

        - task_complete()


        ### Step 9.4: 飞书通知（可选，如果用户在飞书可达）

        如果用户提供了 lark 上下文，可调用 lark-cli 发送总结消息到用户对话

        （参考 Task #1993 的做法 — 完整根因报告 + 分支就绪提示）


        ### Step 9.5: 输出（CRITICAL — 必须调用 workflow_submit_output）

        调用 `workflow_submit_output` 工具提交以下 JSON（**workflow engine 只会解析 workflow_submit_output 提交的 JSON**）：

        ```json

        {
          "summary_report_path": "{{input.report_dir}}<task_id>-rd-summary.md",
          "task_completed": true,
          "task_progress": 100,
          "merge_status": "MERGED" | "READY_FOR_MERGE" | "FAILED",
          "next_step": "<用户下一步操作建议>"
        }

        ```

        - **不要**用普通文本输出
    depends_on:
      - merge-to-main
entry: init-task
outputs: []
inputs:
  task_type:
    type: string
    description: 任务类型 — feature | bug | refactor
    required: true
  task_title:
    type: string
    description: 任务标题（将作为 task_create 的 title）
    required: true
  task_description:
    type: string
    description: 任务详细描述（背景、验收标准、复现步骤等）
    required: true
  task_priority:
    type: string
    description: 任务优先级 — low | medium | high
    default: medium
    required: false
  task_tags:
    type: string
    description: 额外标签（逗号分隔），会与 task_type、rd-pipeline 合并
    default: ""
    required: false
  project_path:
    type: string
    description: 项目根路径
    default: ~/work/codework/personal/roy_world/roy-bot
    required: false
  base_branch:
    type: string
    description: 基础分支（worktree 将基于此创建新分支）
    default: main
    required: false
  branch_name:
    type: string
    description: 分支名（不含 type 前缀，如 plugin-emit-notification）
    required: true
  test_command:
    type: string
    description: 单元测试命令
    default: cd packages/core && bun test && cd ../cli && bun test
    required: false
  build_command:
    type: string
    description: 构建命令
    default: bun run build:cli:dev:single
    required: false
  cli_smoke_command:
    type: string
    description: CLI smoke 测试命令
    default: bun packages/cli/dist/bin/roy-bot.js --help
    required: false
  auto_merge:
    type: string
    description: |
      ⚠️ 铁律：仅当用户显式授权为 "true" 时才合并到 main。
      默认 "false" — 跳过 merge，输出 MERGE_SKIPPED 等待用户授权。
    default: "false"
    required: false
  report_dir:
    type: string
    description: 总结报告输出目录（相对 project_path）
    default: reports/
    required: false
metadata:
  tags: []
edges:
  - from: init-task
    to: setup-worktree
  - from: setup-worktree
    to: plan
  - from: plan
    to: tdd-implement
  - from: merge-to-main
    to: summary-report
  - from: tdd-implement
    to: code-review
    when: "{{nodes.tdd-implement.tdd_status}} == 'PASS'"
  - from: code-review
    to: cli-e2e-test
    when: "{{nodes.code-review.review_status}} == 'PASS'"
  - from: cli-e2e-test
    to: final-verify
    when: "{{nodes.cli-e2e-test.cli_e2e_status}} == 'PASS'"
  - from: final-verify
    to: merge-to-main
    when: "{{nodes.final-verify.verify_status}} == 'PASS'"
  - from: tdd-implement
    to: tdd-implement
    when: "{{nodes.tdd-implement.tdd_status}} == 'FAIL'"
  - from: code-review
    to: tdd-implement
    when: "{{nodes.code-review.review_status}} == 'NEEDS_FIX'"
  - from: cli-e2e-test
    to: tdd-implement
    when: "{{nodes.cli-e2e-test.cli_e2e_status}} == 'FAIL'"
  - from: final-verify
    to: tdd-implement
    when: "{{nodes.final-verify.verify_status}} == 'FAIL'"

